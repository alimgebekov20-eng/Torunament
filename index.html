/* ============ CREATE ============ */
function createTournament(){
  const w=state.wiz;
  const n=w.teams.length;
  const mode=w.mode;
  if(mode==='classic'){
    const errs=validateZones(w.zones,n);
    if(errs.length){alert('Ошибки в зонах:\n'+errs.join('\n'));return;}
  }
  const teams=w.teams.map((t,i)=>((t||'').trim()||('Команда '+(i+1))));
  if(mode==='classic'){
    const schedule=generateSchedule(n,w.circles);
    state.tournament={v:5,mode:'classic',name:(w.name||'').trim()||'Турнир',teams,circles:w.circles,
      zones:w.zones.map(z=>({type:z.type,from:z.from,to:z.to})),schedule,playoff:null,styk:null,createdAt:Date.now()};
  } else if(mode==='worldcup'){
    const numGroups=Math.max(2,Math.ceil(n/4));
    const baseSize=Math.floor(n/numGroups);
    const extra=n%numGroups;
    const groups=[];
    let idx=0;
    for(let g=0;g<numGroups;g++){
      const size=baseSize+(g<extra?1:0);
      const teamIds=[];
      for(let k=0;k<size;k++)teamIds.push(idx++);
      const sch=generateSchedule(size,1);
      groups.push({name:String.fromCharCode(65+g),teamIds,schedule:sch});
    }
    state.tournament={v:5,mode:'worldcup',name:(w.name||'').trim()||'ЧМ',teams,circles:1,groups,knockout:null,createdAt:Date.now()};
  } else {
    const schedule=generateSchedule(n,1);
    state.tournament={v:5,mode:'lch',name:(w.name||'').trim()||'ЛЧ',teams,circles:1,schedule,lchPlayoff:null,playoff:null,createdAt:Date.now()};
  }
  state.round=1;
  state.tab=mode==='worldcup'?'groups':mode==='lch'?'league':'table';
  state.screen='tournament';
  saveTournament();
  render();
}

/* ============ BRACKET BUILD ============ */
function buildBracket(teamIds){
  const n=teamIds.length;
  if(n<2)return null;
  const size=pow2Ceil(n);
  const padded=teamIds.slice();
  while(padded.length<size)padded.push(null);
  const pairs=seedPairs(size);
  const matches=pairs.map(([a,b])=>({h:padded[a-1],a:padded[b-1],hg:null,ag:null,ph:null,pa:null}));
  return {size,seedCount:n,rounds:[{name:roundName(size),matches}],third:null,champion:null};
}
function checkBracketProgress(bracket,withThird){
  if(!bracket)return;
  let guard=0;
  while(guard++<20){
    const R=bracket.rounds[bracket.rounds.length-1];
    if(!R)break;
    const complete=R.matches.every(m=>matchWinner(m)!=null);
    if(!complete)break;
    if(R.matches.length===1){bracket.champion=matchWinner(R.matches[0]);break;}
    const winners=R.matches.map(m=>matchWinner(m));
    const nm=[];
    for(let k=0;k<winners.length;k+=2)nm.push({h:winners[k],a:winners[k+1],hg:null,ag:null,ph:null,pa:null});
    bracket.rounds.push({name:roundName(nm.length*2),matches:nm});
    if(withThird&&R.matches.length===2&&!bracket.third){
      const losers=R.matches.map(m=>matchWinner(m)===m.h?m.a:m.h);
      bracket.third={h:losers[0],a:losers[1],hg:null,ag:null,ph:null,pa:null};
    }
  }
}
function randomizeBracketRound(bracket,withThird){
  if(!bracket)return false;
  for(let ri=0;ri<bracket.rounds.length;ri++){
    const R=bracket.rounds[ri];
    const incomplete=R.matches.filter(m=>matchWinner(m)==null && m.h!=null && m.a!=null);
    if(incomplete.length===0)continue;
    incomplete.forEach(m=>{
      let hg=Math.floor(Math.random()*5),ag=Math.floor(Math.random()*5);
      if(hg===ag){if(Math.random()<0.5)hg++;else ag++;}
      m.hg=hg;m.ag=ag;m.ph=null;m.pa=null;
    });
    checkBracketProgress(bracket,withThird);
    return true;
  }
  if(withThird&&bracket.third&&matchWinner(bracket.third)==null){
    let hg=Math.floor(Math.random()*5),ag=Math.floor(Math.random()*5);
    if(hg===ag){if(Math.random()<0.5)hg++;else ag++;}
    bracket.third.hg=hg;bracket.third.ag=ag;
    return true;
  }
  return false;
}
function randomizeStykClassic(){
  const t=state.tournament;
  const R=t.styk.rounds[0];
  const incomplete=R.matches.filter(m=>matchWinner(m)==null);
  if(incomplete.length===0)return false;
  incomplete.forEach(m=>{
    let hg=Math.floor(Math.random()*5),ag=Math.floor(Math.random()*5);
    if(hg===ag){if(Math.random()<0.5)hg++;else ag++;}
    m.hg=hg;m.ag=ag;m.ph=null;m.pa=null;
  });
  checkClassicPlayoffComplete();
  return true;
}

/* ============ CLASSIC STYK ============ */
function makeClassicPlayoff(){
  const t=state.tournament;
  const st=computeStandings(t);
  const pz=t.zones.find(z=>z.type==='playoff');
  const sz=t.zones.find(z=>z.type==='styk');
  if(!pz && !sz){alert('Нужна зона «Плей-офф» или «Стыковые матчи»');return;}
  const directTeams = pz ? st.slice(pz.from-1,pz.to).map(s=>s.teamId) : [];
  const stykTeams = sz ? st.slice(sz.from-1,sz.to).map(s=>s.teamId) : [];
  if(stykTeams.length < 2){
    t.playoff = buildBracket(directTeams);
    t.styk = null;
    t.phase = 'playoff';
    saveTournament();render();return;
  }
  const cnt = stykTeams.length;
  const pairCount = Math.floor(cnt/2);
  const matches = [];
  const byeTeams = [];
  for(let i=0;i<pairCount;i++){
    matches.push({h:stykTeams[i],a:stykTeams[cnt-1-i],hg:null,ag:null,ph:null,pa:null});
  }
  if(cnt % 2 === 1)byeTeams.push(stykTeams[Math.floor(cnt/2)]);
  t.styk = {rounds:[{name:'Стыковые',matches}],third:null,champion:null,_directTeams:directTeams,_byeTeams:byeTeams};
  t.playoff = null;
  t.phase = 'playoff';
  saveTournament();render();
}
function checkClassicPlayoffComplete(){
  const t=state.tournament;
  if(t.mode!=='classic')return;
  if(!t.styk || t.playoff)return;
  const allComplete = t.styk.rounds[0].matches.every(m=>matchWinner(m)!=null);
  if(!allComplete)return;
  const winners = t.styk.rounds[0].matches.map(m=>matchWinner(m));
  const allTeams = (t.styk._directTeams||[]).concat(t.styk._byeTeams||[]).concat(winners);
  t.playoff = buildBracket(allTeams);
  saveTournament();
}
function makeWCKnockout(){
  const t=state.tournament;
  if(!t.groups)return;
  const qualifiers=[];
  t.groups.forEach(g=>{
    const st=computeStandingsFromSchedule(g.schedule,g.teamIds,t.teams);
    qualifiers.push(st[0].teamId);
    if(st[1])qualifiers.push(st[1].teamId);
  });
  const bracket=buildBracket(qualifiers);
  if(!bracket){alert('Не удалось сформировать');return;}
  t.knockout=bracket;
  saveTournament();render();
}
function makeLCHPlayoff(){
  const t=state.tournament;
  const st=computeStandingsFromSchedule(t.schedule,t.teams.map((_,i)=>i),t.teams);
  const n=t.teams.length;
  const K=Math.max(4,pow2Floor(Math.floor(n/2)));
  const direct=K/2;
  const playoffEnd=Math.min(direct+K,n);
  const directTeams=st.slice(0,direct).map(s=>s.teamId);
  const playoffTeams=st.slice(direct,playoffEnd).map(s=>s.teamId);
  const pairCount=Math.floor(playoffTeams.length/2);
  const pairs=[];
  const byeTeams=[];
  for(let i=0;i<pairCount;i++){
    pairs.push({h:playoffTeams[i],a:playoffTeams[playoffTeams.length-1-i],hg:null,ag:null,ph:null,pa:null});
  }
  if(playoffTeams.length%2===1)byeTeams.push(playoffTeams[Math.floor(playoffTeams.length/2)]);
  if(!pairs.length){
    t.playoff=buildBracket(directTeams.concat(byeTeams));
  } else {
    t.lchPlayoff={rounds:[{name:'Стыковые',matches:pairs}],third:null,champion:null,_directTeams:directTeams,_byeTeams:byeTeams};
  }
  saveTournament();render();
}
function checkLCHPlayoffComplete(){
  const t=state.tournament;
  if(!t.lchPlayoff||t.playoff)return;
  const all=t.lchPlayoff.rounds[0].matches.every(m=>matchWinner(m)!=null);
  if(!all)return;
  const winners=t.lchPlayoff.rounds[0].matches.map(m=>matchWinner(m));
  const allTeams=(t.lchPlayoff._directTeams||[]).concat(t.lchPlayoff._byeTeams||[]).concat(winners);
  t.playoff=buildBracket(allTeams);
  saveTournament();
}

/* ============ FINAL MATCH LIVE ============ */
function playFinalMatch(t, bracket, ri, mi){
  const R = bracket.rounds[ri];
  if(!R) return;
  const m = R.matches[mi];
  if(!m || m.h == null || m.a == null) return;
  if(m.hg != null && m.ag != null) return;
  if(document.querySelector('.final-overlay')) return;

  const hName = t.teams[m.h];
  const aName = t.teams[m.a];

  const ov = document.createElement('div');
  ov.className = 'final-overlay';
  ov.innerHTML = `
    <button class="close-x" data-act="close-final">✕</button>
    <div class="final-stage">
      <div class="final-minute">0'</div>
      <div class="final-title">ФИНАЛ</div>
      <div class="final-scoreboard">
        <div class="final-team-name left">${esc(hName)}</div>
        <div class="final-score">
          <span class="fs-h">0</span>
          <span class="fs-sep">:</span>
          <span class="fs-a">0</span>
        </div>
        <div class="final-team-name right">${esc(aName)}</div>
      </div>
      <div class="final-progress"><div class="fp-bar"></div></div>
      <div class="final-events"></div>
      <div class="final-hint">Первый тайм начинается...</div>
    </div>
  `;
  document.body.appendChild(ov);

  const minuteEl = ov.querySelector('.final-minute');
  const titleEl = ov.querySelector('.final-title');
  const hEl = ov.querySelector('.fs-h');
  const aEl = ov.querySelector('.fs-a');
  const barEl = ov.querySelector('.fp-bar');
  const eventsEl = ov.querySelector('.final-events');
  const scoreboardEl = ov.querySelector('.final-scoreboard');
  const scoreEl = ov.querySelector('.final-score');
  const hintEl = ov.querySelector('.final-hint');

  let minute = 0;
  let hg = 0, ag = 0;

  // Предгенерируем голы (1-5 голов)
  const numGoals = 1 + Math.floor(Math.random() * 5);
  const goalMinutes = new Set();
  while(goalMinutes.size < numGoals){
    goalMinutes.add(1 + Math.floor(Math.random() * 89));
  }

  const interval = setInterval(() => {
    if(!document.body.contains(ov)){
      clearInterval(interval);
      return;
    }
    minute++;

    minuteEl.textContent = minute + "'";
    minuteEl.classList.add('pulse');
    setTimeout(() => minuteEl.classList.remove('pulse'), 150);
    barEl.style.width = (minute / 90 * 100) + '%';

    if(minute === 45){
      titleEl.textContent = 'ПЕРЕРЫВ';
      hintEl.textContent = 'Второй тайм...';
    } else if(minute === 46){
      titleEl.textContent = 'ФИНАЛ';
    }

    if(goalMinutes.has(minute)){
      const isHome = Math.random() < 0.5;
      if(isHome) hg++; else ag++;
      hEl.textContent = hg;
      aEl.textContent = ag;

      const ev = document.createElement('div');
      ev.className = 'final-event';
      ev.innerHTML = `<span class="ev-min">${minute}'</span><span class="ev-goal">⚽</span><span class="ev-team">${esc(isHome ? hName : aName)}</span>`;
      eventsEl.appendChild(ev);
      eventsEl.scrollTop = eventsEl.scrollHeight;

      scoreboardEl.classList.add('goal-flash');
      scoreEl.classList.add('goal');
      setTimeout(() => {
        scoreboardEl.classList.remove('goal-flash');
        scoreEl.classList.remove('goal');
      }, 500);
    }

    if(minute >= 90){
      clearInterval(interval);
      minuteEl.textContent = "90'";
      barEl.style.width = '100%';
      setTimeout(() => finishFinalMatch(t, bracket, m, hg, ag, ov, hName, aName), 1000);
    }
  }, 55);
}

function finishFinalMatch(t, bracket, m, hg, ag, ov, hName, aName){
  if(!document.body.contains(ov)) return;
  const minuteEl = ov.querySelector('.final-minute');
  const titleEl = ov.querySelector('.final-title');
  const eventsEl = ov.querySelector('.final-events');
  const hintEl = ov.querySelector('.final-hint');
  const scoreEl = ov.querySelector('.final-score');

  if(hg === ag){
    // Пенальти
    titleEl.textContent = 'ПЕНАЛЬТИ';
    hintEl.textContent = 'Серия послематчевых пенальти';
    minuteEl.textContent = '⚽';
    minuteEl.classList.add('small');

    // Генерируем счёт пенальти
    let hp = 3 + Math.floor(Math.random() * 3);
    let ap = 3 + Math.floor(Math.random() * 3);
    while(hp === ap){
      hp = 3 + Math.floor(Math.random() * 3);
      ap = 3 + Math.floor(Math.random() * 3);
    }

    // Визуальная серия пенальти
    const totalKicks = 5;
    for(let i = 0; i < totalKicks; i++){
      setTimeout(() => {
        if(!document.body.contains(ov)) return;
        const isHome = i % 2 === 0;
        const scored = Math.random() < 0.75;
        const ev = document.createElement('div');
        ev.className = 'final-event pen' + (scored ? '' : ' miss');
        ev.innerHTML = `<span class="ev-min">ПЕН</span><span class="ev-goal">${scored ? '⚽' : '❌'}</span><span class="ev-team">${esc(isHome ? hName : aName)}</span>`;
        eventsEl.appendChild(ev);
        eventsEl.scrollTop = eventsEl.scrollHeight;
      }, i * 260);
    }

    setTimeout(() => {
      if(!document.body.contains(ov)) return;
      m.hg = hg;
      m.ag = ag;
      m.ph = hp;
      m.pa = ap;
      m.p = true;

      minuteEl.textContent = 'МАТЧ ОКОНЧЕН';
      minuteEl.classList.add('small');
      scoreEl.innerHTML = `<span class="fs-h">${hg}</span><span class="fs-sep">:</span><span class="fs-a">${ag}</span><span class="fs-pen">(${hp}:${ap})</span>`;
      hintEl.textContent = 'Победа по пенальти!';

      closeFinalAndShowPodium(t, bracket, ov);
    }, totalKicks * 260 + 900);
  } else {
    // Победа в основное время
    m.hg = hg;
    m.ag = ag;
    m.p = true;

    minuteEl.textContent = 'МАТЧ ОКОНЧЕН';
    minuteEl.classList.add('small');
    titleEl.textContent = 'ФИНАЛ';
    hintEl.textContent = 'Финальный свисток!';

    closeFinalAndShowPodium(t, bracket, ov);
  }
}

function closeFinalAndShowPodium(t, bracket, ov){
  setTimeout(() => {
    if(!document.body.parentNode) return;
    ov.style.transition = 'opacity .7s';
    ov.style.opacity = '0';
    setTimeout(() => {
      if(ov.parentNode) ov.remove();
      checkBracketProgress(bracket, true);
      saveTournament();
      render({keepScroll: true});
      if(bracket.champion != null){
        setTimeout(() => showPodium(t), 600);
      }
    }, 750);
  }, 1800);
}

/* ============ SCORE HANDLING ============ */
function tourField(act,el,isChange){
  const t=state.tournament;
  if(!t||act!=='score')return;
  const kind=el.dataset.kind;
  const ri=+el.dataset.ri,mi=+el.dataset.mi,side=el.dataset.side;

  let m=null;
  if(kind==='reg'){const r=t.schedule[ri];if(r)m=r.matches[mi];}
  else if(kind==='group'){const g=t.groups[ri];if(g){const r=g.schedule[state.round-1];if(r)m=r.matches[mi];}}
  else if(kind==='ko'){const R=t.knockout&&t.knockout.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='po'){const R=t.playoff&&t.playoff.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='styk'){const R=t.styk&&t.styk.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='lchpo'){const R=t.lchPlayoff&&t.lchPlayoff.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='third'){m=t.playoff&&t.playoff.third;}
  if(!m)return;

  const raw=el.value.trim();
  if(raw==='')m[side]=null;
  else{m[side]=clamp(parseInt(raw,10)||0,0,(side==='ph'||side==='pa')?20:99);}

  if(kind==='reg'||kind==='group'){
    m.p=(m.hg!=null&&m.ag!=null);
    updateRoundProgress();
    saveTournament();
    return;
  }

  const champBefore=t.playoff&&t.playoff.champion;

  if(kind==='ko')checkBracketProgress(t.knockout,true);
  else if(kind==='po')checkBracketProgress(t.playoff,true);
  else if(kind==='lchpo'){checkBracketProgress(t.lchPlayoff,false);checkLCHPlayoffComplete();}
  else if(kind==='styk'){checkClassicPlayoffComplete();}

  saveTournament();

  if(isChange){
    render({keepScroll:true});
    const champAfter=t.playoff&&t.playoff.champion;
    if(champAfter!=null&&champBefore==null){
      setTimeout(()=>showPodium(t),400);
    }
  }
}

/* ============ WIZARD FIELD ============ */
function wizardField(act,el,isChange){
  const w=state.wiz;if(!w)return;
  switch(act){
    case 'wiz-name':w.name=el.value;break;
    case 'preset-name':w.newPresetName=el.value;break;
    case 'team-name':{const i=+el.dataset.i;if(i>=0&&i<w.teams.length)w.teams[i]=el.value;break;}
    case 'team-count':if(isChange)setCount(parseInt(el.value,10)||2);break;
    case 'circles':if(isChange){w.circles=clamp(parseInt(el.value,10)||1,1,54);render({keepScroll:true});}break;
    case 'circ-range':{
      w.circles=clamp(parseInt(el.value,10)||1,1,54);
      const num=document.querySelector('[data-act="circles"]');if(num)num.value=w.circles;
      const sl=document.querySelector('.stat-line');
      if(sl){const n=w.teams.length;sl.innerHTML='Туров: <b>'+numRounds(n,w.circles)+'</b> · Матчей: <b>'+((n*(n-1)/2)*w.circles)+'</b>';}
      if(isChange)render({keepScroll:true});
      break;
    }
    case 'zone-type':if(isChange){w.zones[+el.dataset.i].type=el.value;render({keepScroll:true});}break;
    case 'zone-from':if(isChange){w.zones[+el.dataset.i].from=clamp(parseInt(el.value,10)||1,1,32);render({keepScroll:true});}break;
    case 'zone-to':if(isChange){w.zones[+el.dataset.i].to=clamp(parseInt(el.value,10)||1,1,32);render({keepScroll:true});}break;
  }
}
function setCount(n){
  const w=state.wiz;n=clamp(n,2,32);
  while(w.teams.length<n)w.teams.push('Команда '+(w.teams.length+1));
  while(w.teams.length>n)w.teams.pop();
  w.zones=w.zones.map(z=>{let from=clamp(z.from,1,n),to=clamp(z.to,1,n);if(from>to)from=to;return{type:z.type,from,to};});
  render({keepScroll:true});
}

/* ============ PODIUM ============ */
function showPodium(t){
  if(document.querySelector('.podium-overlay'))return;
  const champ=t.playoff&&t.playoff.champion;
  if(champ==null)return;
  const P=t.playoff;
  let second=null,third=null;
  const finalR=P.rounds[P.rounds.length-1];
  if(finalR&&finalR.matches.length===1){
    const fm=finalR.matches[0];
    const w=matchWinner(fm);
    second=w===fm.h?fm.a:fm.h;
  }
  if(P.third&&matchWinner(P.third)!=null)third=matchWinner(P.third);
  const confColors=['#FFD700','#C0C0C0','#CD7F32','#22c55e','#3b82f6','#ef4444','#a855f7','#ffffff'];
  const pieces=[];
  for(let i=0;i<80;i++){
    const left=Math.random()*100;
    const delay=(Math.random()*3).toFixed(2);
    const dur=(2.8+Math.random()*3).toFixed(2);
    const col=confColors[Math.floor(Math.random()*confColors.length)];
    const w=6+Math.floor(Math.random()*8);
    const h=10+Math.floor(Math.random()*10);
    pieces.push(`<div class="confetti-piece" style="left:${left}%;width:${w}px;height:${h}px;background:${col};animation-delay:${delay}s;animation-duration:${dur}s;border-radius:${Math.random()<0.4?'50%':'2px'}"></div>`);
  }
  const ov=document.createElement('div');
  ov.className='podium-overlay';
  ov.innerHTML=`
    <button class="close-x" data-act="close-podium">✕</button>
    <div class="confetti-wrap">${pieces.join('')}</div>
    <div class="podium-title">
      <div class="trophy">🏆</div>
      <div class="label">ЧЕМПИОН</div>
      <div class="champ-name">${esc(t.teams[champ])}</div>
      <div class="sub">${esc(t.name)}</div>
    </div>
    <div class="podium-stage">
      ${second!=null?`<div class="podium-col pos-2"><div class="podium-name">${esc(t.teams[second])}</div><div class="podium-block silver">2</div></div>`:''}
      <div class="podium-col pos-1"><div class="podium-name">${esc(t.teams[champ])}</div><div class="podium-block gold">1</div></div>
      ${third!=null?`<div class="podium-col pos-3"><div class="podium-name">${esc(t.teams[third])}</div><div class="podium-block bronze">3</div></div>`:''}
    </div>
    <button class="podium-ok" data-act="close-podium">Отлично!</button>
  `;
  document.body.appendChild(ov);
  setTimeout(()=>{
    if(ov.parentNode){
      ov.style.transition='opacity .6s';
      ov.style.opacity='0';
      setTimeout(()=>ov.remove(),600);
    }
  },11000);
}

/* ============ ACTIONS ============ */
function handleAction(act,el){
  const w=state.wiz;
  switch(act){
    case 'go-create':state.wiz=newWiz();state.screen='create';render();break;
    case 'go-import':state.screen='import';render();break;
    case 'go-settings':state.screen='settings';render();break;
    case 'go-about':state.screen='about';render();break;
    case 'continue':state.screen='tournament';state.round=1;state.tab=null;render();break;
    case 'to-menu':state.screen='menu';render();break;

    case 'wiz-back':if(w.step>1){w.step--;render();}else{state.screen='menu';render();}break;
    case 'wiz-next':
      if(w.step===3&&w.mode==='classic'){
        const errs=validateZones(w.zones,w.teams.length);
        if(errs.length){alert('Исправьте зоны:\n'+errs.join('\n'));break;}
      }
      w.step++;render();break;
    case 'wiz-prev':w.step--;render();break;
    case 'wiz-create':createTournament();break;
    case 'set-mode':w.mode=el.dataset.mode;render();break;

    case 'preset':{
      const key=el.dataset.key;
      const p=findPreset(key);
      if(p){w.presetKey=key;w.teams=p.teams.slice(0,32);w.zones=defaultZones(w.teams.length);render();}
      break;
    }
    case 'count-inc':setCount(w.teams.length+1);break;
    case 'count-dec':setCount(w.teams.length-1);break;
    case 'shuffle':{const a=w.teams;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}render();break;}
    case 'reset-names':w.teams=w.teams.map((t,i)=>'Команда '+(i+1));render();break;
    case 'load-bulk':{
      const ta=document.querySelector('[data-act="bulk"]');if(!ta)break;
      const list=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if(list.length<2){alert('Минимум 2 команды');break;}
      w.teams=list.slice(0,32);w.zones=defaultZones(w.teams.length);render();
      break;
    }
    case 'save-preset':{
      const name=(w.newPresetName||'').trim();
      if(!name){alert('Введите название');break;}
      customPresets.push({name,teams:w.teams.slice()});
      LS.set('ft_presets',customPresets);w.newPresetName='';alert('Пресет сохранён');render();
      break;
    }
    case 'circ-inc':w.circles=clamp(w.circles+1,1,54);render();break;
    case 'circ-dec':w.circles=clamp(w.circles-1,1,54);render();break;
    case 'zone-add':w.zones.push({type:'styk',from:1,to:1});render();break;
    case 'zone-del':w.zones.splice(+el.dataset.i,1);render();break;

    case 'tab':state.tab=el.dataset.tab;render();break;
    case 'round-prev':state.round=Math.max(1,state.round-1);render();break;
    case 'round-next':{
      const t=state.tournament;
      let maxR=1;
      if((t.mode||'classic')==='worldcup'&&t.groups)maxR=t.groups[0]?t.groups[0].schedule.length:1;
      else maxR=t.schedule.length;
      state.round=Math.min(maxR,state.round+1);render();
      break;
    }
    case 'random-round':{
      const t=state.tournament;
      const r=t.schedule[state.round-1];if(!r)break;
      r.matches.forEach(m=>{m.hg=Math.floor(Math.random()*4);m.ag=Math.floor(Math.random()*4);m.p=true;});
      saveTournament();render();break;
    }
    case 'random-group-round':{
      const t=state.tournament;
      t.groups.forEach(g=>{
        const r=g.schedule[state.round-1];if(!r)return;
        r.matches.forEach(m=>{m.hg=Math.floor(Math.random()*4);m.ag=Math.floor(Math.random()*4);m.p=true;});
      });
      saveTournament();render();break;
    }
    case 'clear-round':{
      const t=state.tournament;const r=t.schedule[state.round-1];if(!r)break;
      if(!confirm('Очистить тур '+r.round+'?'))break;
      r.matches.forEach(m=>{m.hg=null;m.ag=null;m.p=false;});
      saveTournament();render();break;
    }

    case 'make-playoff':if(confirm('Сформировать стыковые матчи и плей-офф?'))makeClassicPlayoff();break;
    case 'make-wc-knockout':if(confirm('Сформировать плей-офф ЧМ?'))makeWCKnockout();break;
    case 'make-lch-playoff':if(confirm('Сформировать стыковые матчи?'))makeLCHPlayoff();break;

    case 'play-final':{
      const t=state.tournament;
      const kind=el.dataset.bracket;
      const ri=+el.dataset.ri;
      const mi=+el.dataset.mi;
      let bracket=null;
      if(kind==='ko')bracket=t.knockout;
      else if(kind==='po')bracket=t.playoff;
      else if(kind==='lchpo')bracket=t.lchPlayoff;
      if(!bracket)break;
      playFinalMatch(t,bracket,ri,mi);
      break;
    }
    case 'close-final':{
      const ov=document.querySelector('.final-overlay');
      if(ov){
        ov.style.transition='opacity .3s';
        ov.style.opacity='0';
        setTimeout(()=>ov.remove(),300);
      }
      break;
    }

    case 'random-bracket':{
      const t=state.tournament;const which=el.dataset.bracket;
      const before=(which==='po'&&t.playoff)?t.playoff.champion:null;
      let ok=false;
      if(which==='ko'&&t.knockout)ok=randomizeBracketRound(t.knockout,true);
      if(which==='po'&&t.playoff)ok=randomizeBracketRound(t.playoff,true);
      if(which==='styk'&&t.styk)ok=randomizeStykClassic();
      if(which==='lchpo'&&t.lchPlayoff){ok=randomizeBracketRound(t.lchPlayoff,false);if(ok)checkLCHPlayoffComplete();}
      if(!ok){alert('Все матчи завершены');break;}
      saveTournament();render({keepScroll:true});
      const after=(which==='po'&&t.playoff)?t.playoff.champion:null;
      if(after!=null&&before==null)setTimeout(()=>showPodium(t),400);
      break;
    }
    case 'close-podium':{
      const ov=document.querySelector('.podium-overlay');
      if(ov){ov.style.transition='opacity .4s';ov.style.opacity='0';setTimeout(()=>ov.remove(),400);}
      break;
    }
    case 'copy-export':{
      const ta=document.getElementById('export-area');if(!ta)break;
      ta.select();ta.setSelectionRange(0,999999);
      let ok=false;try{ok=document.execCommand('copy');}catch(e){}
      if(navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>{}).catch(()=>{});ok=true;}
      alert(ok?'Код скопирован':'Скопируйте вручную');
      break;
    }
    case 'reset-tournament':{
      if(!confirm('Сбросить все результаты?'))break;
      const t=state.tournament;
      if(t.schedule)t.schedule.forEach(r=>r.matches.forEach(m=>{m.hg=null;m.ag=null;m.p=false;}));
      if(t.groups)t.groups.forEach(g=>g.schedule.forEach(r=>r.matches.forEach(m=>{m.hg=null;m.ag=null;m.p=false;})));
      t.knockout=null;t.playoff=null;t.styk=null;t.lchPlayoff=null;t.phase='regular';
      state.round=1;saveTournament();render();break;
    }
    case 'delete-tournament':{
      if(!confirm('Удалить турнир?'))break;
      state.tournament=null;LS.set('ft_tournament',null);state.screen='menu';render();break;
    }
    case 'do-import':{
      const ta=document.querySelector('[data-act="import-text"]');if(!ta)break;
      tryImport(ta.value);break;
    }
    case 'set-theme':settings.theme=el.dataset.theme;LS.set('ft_settings',settings);applyTheme();render();break;
    case 'set-accent':settings.accent=el.dataset.accent;LS.set('ft_settings',settings);applyTheme();render();break;
    case 'del-preset':customPresets.splice(+el.dataset.i,1);LS.set('ft_presets',customPresets);render();break;
    case 'clear-data':
      if(!confirm('Удалить все данные?'))break;
      localStorage.removeItem('ft_tournament');localStorage.removeItem('ft_presets');localStorage.removeItem('ft_settings');
      state.tournament=null;customPresets=[];settings={theme:'dark',accent:'#22c55e'};applyTheme();render();
      break;
  }
}

/* ============ IMPORT ============ */
function tryImport(text){
  if(!text||!text.trim()){alert('Вставьте код');return;}
  let obj=null;
  try{obj=JSON.parse(text.trim());}catch(e){alert('Ошибка JSON');return;}
  const err=validateImported(obj);
  if(err){alert('Ошибка: '+err);return;}
  state.tournament=obj;state.round=1;
  state.tab=(obj.mode==='worldcup')?'groups':(obj.mode==='lch')?'league':'table';
  state.screen='tournament';saveTournament();render();
  alert('Турнир «'+obj.name+'» импортирован!');
}
function validateImported(o){
  if(!o||typeof o!=='object')return 'не объект';
  if(!Array.isArray(o.teams)||o.teams.length<2)return 'нет команд';
  if(!o.mode)o.mode='classic';
  if(o.mode==='worldcup'){if(!Array.isArray(o.groups))return 'нет групп';}
  else{if(!Array.isArray(o.schedule)||!o.schedule.length)return 'нет календаря';}
  if(typeof o.name!=='string')o.name='Импортированный';
  if(!Array.isArray(o.zones))o.zones=[];
  if(o.playoff===undefined)o.playoff=null;
  if(o.styk===undefined)o.styk=null;
  if(o.knockout===undefined)o.knockout=null;
  if(o.lchPlayoff===undefined)o.lchPlayoff=null;
  return null;
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const tag=el.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='OPTION')return;
  handleAction(el.dataset.act,el);
});
document.addEventListener('input',function(e){
  const el=e.target;const act=el.dataset.act;if(!act)return;
  if(state.screen==='create')wizardField(act,el,false);
  else if(state.screen==='tournament')tourField(act,el,false);
});
document.addEventListener('change',function(e){
  const el=e.target;const act=el.dataset.act;
  if(act==='import-file'){
    const f=el.files&&el.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=function(){tryImport(String(fr.result));};
    fr.readAsText(f);
    return;
  }
  if(!act)return;
  if(state.screen==='create')wizardField(act,el,true);
  else if(state.screen==='tournament')tourField(act,el,true);
});

/* ============ START ============ */
applyTheme();
if(state.tournament){
  try{const err=validateImported(state.tournament);if(err)state.tournament=null;}catch(e){state.tournament=null;}
}
render();
</script>
