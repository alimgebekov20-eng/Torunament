<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<title>Футбольный турнир и Матчи</title>
<style>
:root{--accent:#22c55e;--accent-contrast:#06120a;--radius:18px;}
[data-theme="dark"]{--bg:#0a1018;--bg2:#0f1725;--card:#141f30;--card2:#1b283c;--text:#e7eefb;--muted:#8296b5;--border:#22314a;--shadow:0 8px 24px rgba(0,0,0,.35);}
[data-theme="light"]{--bg:#eef2f8;--bg2:#e4eaf4;--card:#fff;--card2:#f4f7fc;--text:#0d1a2b;--muted:#5c6c86;--border:#dae2ef;--shadow:0 8px 24px rgba(20,40,80,.08);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.42;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;}
#app{max-width:620px;margin:0 auto;padding:0 14px 70px;padding-top:env(safe-area-inset-top);}
h1,h2,h3{margin:0;}
.muted{color:var(--muted);}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0;}
.lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:20;}
.topbar-title{flex:1;font-weight:700;font-size:17px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:0;}
.icon-btn:active{transform:scale(.94);}
.icon-btn:disabled{opacity:.3;}
.icon-btn.del{width:32px;height:32px;flex:0 0 32px;font-size:14px;border-radius:10px;color:#ef4444;}
.btn{display:block;width:100%;padding:15px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;text-align:center;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.btn.danger{color:#ef4444;border-color:rgba(239,68,68,.35);}
.btn.small{padding:11px;font-size:13.5px;border-radius:13px;}
.btn.tiny{padding:7px 12px;font-size:12px;border-radius:10px;width:auto;display:inline-block;}
.btn.big{padding:18px;margin-bottom:8px;}
.btn.big span{display:block;font-size:16px;}
.btn.big small{display:block;font-size:12px;opacity:.75;font-weight:500;margin-top:2px;}
.hero{text-align:center;padding:44px 0 26px;}
.logo{width:84px;height:84px;margin:0 auto 16px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);}
.hero h1{font-size:25px;font-weight:800;letter-spacing:-.02em;}
.hero p{margin:6px 0 0;font-size:13.5px;}
.menu-list{display:flex;flex-direction:column;gap:10px;}
.menu-btn{display:flex;align-items:center;gap:14px;text-align:left;padding:17px 16px;}
.menu-btn .ic{font-size:19px;width:26px;text-align:center;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-title{font-size:17px;font-weight:800;margin-bottom:10px;}
.card.center{text-align:center;}
.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:14px;}
.kv span{color:var(--muted);display:flex;align-items:center;gap:7px;}
.kv b{font-weight:700;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px;}
input,select,textarea{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;line-height:1.5;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}
input[type=range]{padding:0;background:transparent;border:none;height:28px;accent-color:var(--accent);}
.dots{display:flex;gap:6px;justify-content:center;padding:4px 0 16px;}
.dots span{width:34px;height:4px;border-radius:3px;background:var(--border);transition:.2s;}
.dots span.on{background:var(--accent);}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.preset{border:1px solid var(--border);background:var(--card2);border-radius:13px;padding:11px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;transition:.15s;}
.preset:active{transform:scale(.97);}
.preset.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card2));}
.preset b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.preset span{font-size:11.5px;color:var(--muted);}
.counter{display:flex;align-items:center;gap:10px;}
.counter input{text-align:center;font-size:19px;font-weight:800;padding:10px;}
.team-list{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow-y:auto;padding-right:2px;}
.team-row{display:flex;align-items:center;gap:8px;}
.team-row .num{width:26px;flex:0 0 26px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
.team-row input{padding:10px 12px;font-size:14.5px;}
.row-btns{display:flex;gap:8px;margin-top:12px;}
.stat-line{margin-top:10px;font-size:13.5px;color:var(--muted);}
.stat-line b{color:var(--text);}
.zones{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.zone-row{display:flex;align-items:center;gap:7px;}
.zone-row select{flex:1 1 auto;min-width:0;padding:10px 8px;font-size:13.5px;}
.zone-row input{width:56px;flex:0 0 56px;padding:10px 4px;text-align:center;font-size:14px;font-weight:700;}
.zone-row .dash{color:var(--muted);}
.alert{margin-top:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#ef4444;border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.6;}
.ok{margin-top:12px;color:var(--accent);font-size:13px;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12.5px;}
.nav-row{display:flex;gap:10px;margin-top:8px;}
.nav-row .btn{flex:1;}
.tabs{display:flex;gap:5px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:15px;margin-bottom:14px;flex-wrap:wrap;}
.tabs button{flex:1;padding:10px 4px;border-radius:11px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;min-width:70px;}
.tabs button.active{background:var(--accent);color:var(--accent-contrast);}
.standings{width:100%;border-collapse:collapse;font-size:13px;}
.standings th{color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 3px;text-align:center;}
.standings th:nth-child(2){text-align:left;padding-left:8px;}
.standings td{padding:9px 3px;text-align:center;border-top:1px solid var(--border);}
.standings td.tname{text-align:left;font-weight:600;padding-left:8px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.standings td.pos{font-weight:700;padding-left:6px;text-align:left;white-space:nowrap;}
.standings td.pts{font-weight:800;font-size:14px;}
.zbar{display:inline-block;width:3px;height:14px;border-radius:2px;margin-right:7px;vertical-align:-2px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:0 4px 12px;}
.legend span{display:flex;align-items:center;gap:6px;}
.round-nav{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:8px;margin-bottom:10px;}
.round-title{flex:1;text-align:center;font-weight:800;font-size:16px;}
.round-title small{display:block;font-weight:600;font-size:11px;color:var(--muted);}
.round-title .muted{font-weight:600;font-size:13px;}
.progress-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding:0 4px 10px;}
.progress-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border);}
.match:last-child{border-bottom:none;}
.m-team{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.m-team.away{text-align:right;}
.m-team.win{color:var(--accent);}
.m-score{display:flex;align-items:center;gap:3px;}
.m-score input{width:44px;flex:0 0 44px;padding:8px 2px;text-align:center;font-weight:800;font-size:16px;border-radius:11px;}
.m-score span{color:var(--muted);font-weight:800;}
.round-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.round-head h3{font-size:15px;font-weight:800;}
.round-head span{font-size:11.5px;color:var(--muted);}
.bracket-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 0;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
.bracket-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;border-bottom:1px solid var(--border);flex-wrap:gap;gap:8px;}
.bracket-head h3{font-size:15.5px;font-weight:800;}
.bracket-head .acts{display:flex;gap:6px;align-items:center;}
.bracket-head .progress{font-size:11.5px;color:var(--muted);font-weight:600;}
.bracket-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:18px 16px 22px;scrollbar-width:thin;}
.bracket-scroll::-webkit-scrollbar{height:6px;}
.bracket-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.bracket{display:flex;gap:48px;align-items:stretch;}
.bracket-col{display:flex;flex-direction:column;min-width:196px;flex-shrink:0;}
.bracket-col-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);text-align:center;padding-bottom:14px;position:relative;}
.bracket-col-title::after{content:'';position:absolute;left:20%;right:20%;bottom:6px;height:2px;background:var(--border);border-radius:1px;}
.bracket-col-body{display:flex;flex-direction:column;justify-content:space-around;gap:14px;flex:1;}
.bracket-match{background:var(--card2);border:1px solid var(--border);border-radius:11px;overflow:hidden;position:relative;transition:.15s;}
.bracket-match:has(.win){border-color:color-mix(in srgb,var(--accent) 55%,var(--border));}
.bracket-team{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--border);min-height:36px;}
.bracket-team:last-child{border-bottom:none;}
.bracket-team.win{background:color-mix(in srgb,var(--accent) 14%,transparent);}
.bracket-team.win .bracket-name{color:var(--accent);font-weight:800;}
.bracket-team.win input{border-color:var(--accent);color:var(--accent);}
.bracket-team.bye .bracket-name{color:var(--muted);font-style:italic;}
.bracket-name{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bracket-team input{width:34px;flex:0 0 34px;padding:4px 2px;text-align:center;font-size:13px;font-weight:800;border-radius:7px;}
.bracket-team input:disabled{opacity:.4;}
.bracket-bye-mark{width:34px;flex:0 0 34px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;}
.bracket-pen{display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 6px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.08em;border-top:1px solid var(--border);}
.bracket-pen input{width:32px;flex:0 0 32px;padding:3px 2px;text-align:center;font-size:12px;font-weight:800;border-radius:6px;}
.bracket-pen span{padding:0 1px;}
.bracket-col:not(:last-child) .bracket-match::after{content:'';position:absolute;right:-25px;top:50%;width:25px;height:2px;background:var(--border);transform:translateY(-50%);pointer-events:none;}
.bracket-col:not(:first-child) .bracket-match::before{content:'';position:absolute;left:-25px;top:50%;width:25px;height:2px;background:var(--border);transform:translateY(-50%);pointer-events:none;}
.bracket-col.champ-col .bracket-col-title::after{background:var(--accent);left:8%;right:8%;}
.champion-box{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fbbf24));color:#08110a;padding:22px 14px;border-radius:14px;text-align:center;font-weight:900;font-size:15px;letter-spacing:.02em;line-height:1.3;box-shadow:0 0 32px color-mix(in srgb,var(--accent) 45%,transparent);animation:champGlow 1.8s ease-in-out infinite alternate;margin:auto 0;}
.champion-box .crown{font-size:28px;display:block;margin-bottom:6px;}
@keyframes champGlow{from{box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent);transform:scale(1);}to{box-shadow:0 0 44px color-mix(in srgb,var(--accent) 65%,transparent);transform:scale(1.02);}}
.stage-intro{text-align:center;padding:26px 6px;}
.stage-intro .ic{font-size:44px;margin-bottom:8px;}
.seg{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:14px;border:1px solid var(--border);}
.seg button{flex:1;padding:11px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;}
.seg button.active{background:var(--accent);color:var(--accent-contrast);}
.accents{display:flex;gap:10px;flex-wrap:wrap;}
.acc{width:44px;height:44px;border-radius:14px;border:3px solid transparent;cursor:pointer;transition:.15s;}
.acc.active{border-color:var(--text);transform:scale(1.06);}
.about p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 12px;}
.about b{color:var(--text);}
.feat{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
.feat div{display:flex;gap:10px;font-size:13.5px;color:var(--muted);}
.feat div b{color:var(--text);font-weight:700;flex:0 0 auto;}
.mode-grid{display:grid;grid-template-columns:1fr;gap:8px;}
.mode-btn{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1px solid var(--border);background:var(--card2);border-radius:14px;color:var(--text);font-family:inherit;cursor:pointer;transition:.15s;}
.mode-btn:active{transform:scale(.98);}
.mode-btn.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card2));}
.mode-btn .mi{font-size:24px;flex:0 0 30px;text-align:center;}
.mode-btn .mt{flex:1;}
.mode-btn .mt b{display:block;font-size:14.5px;font-weight:800;}
.mode-btn .mt span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;}
.mode-btn .mc{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--border);color:var(--muted);}
.mode-btn.active .mc{background:var(--accent);color:var(--accent-contrast);}
.group-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);}
.group-head{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.group-head span{font-size:11px;color:var(--muted);font-weight:600;}
.group-table{width:100%;border-collapse:collapse;font-size:12px;}
.group-table th{color:var(--muted);font-size:9.5px;font-weight:700;text-transform:uppercase;padding:4px 2px;text-align:center;letter-spacing:.03em;}
.group-table th:nth-child(2){text-align:left;padding-left:6px;}
.group-table td{padding:6px 2px;text-align:center;border-top:1px solid var(--border);}
.group-table td.tname{text-align:left;font-weight:600;padding-left:6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.group-table td.pos{text-align:left;padding-left:4px;font-weight:700;width:22px;}
.group-table tr.qualify td{background:color-mix(in srgb,var(--accent) 8%,transparent);}
.group-table tr.qualify td.pos{color:var(--accent);}
.podium-overlay{position:fixed;inset:0;z-index:9999;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a1f2e 0%,#05070c 100%);display:flex;align-items:flex-end;justify-content:center;animation:ovIn .5s ease-out;font-family:inherit;}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}
.podium-overlay .close-x{position:absolute;top:16px;right:16px;z-index:8;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.confetti-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
.confetti-piece{position:absolute;top:-30px;width:10px;height:16px;border-radius:2px;animation:confFall linear infinite;}
@keyframes confFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1;}100%{transform:translateY(115vh) rotate(880deg);opacity:.15;}}
.podium-title{position:absolute;top:8%;left:50%;transform:translateX(-50%);text-align:center;z-index:6;width:100%;pointer-events:none;animation:upIn .8s .8s both;}
.podium-title .trophy{font-size:52px;line-height:1;filter:drop-shadow(0 0 30px rgba(255,215,0,.8));}
.podium-title .label{color:#FFD700;font-size:12px;font-weight:800;letter-spacing:.42em;margin-top:10px;text-indent:.42em;}
.podium-title .champ-name{font-size:26px;font-weight:900;color:#fff;margin-top:6px;text-shadow:0 4px 30px rgba(255,215,0,.55);}
.podium-title .sub{color:rgba(255,255,255,.55);font-size:11.5px;margin-top:4px;font-weight:600;}
@keyframes upIn{from{opacity:0;transform:translateX(-50%) translateY(30px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.podium-stage{position:relative;z-index:3;display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:0 14px 0;width:100%;max-width:520px;height:82vh;}
.podium-col{flex:1;display:flex;flex-direction:column;align-items:center;transform:translateY(110%);opacity:0;animation:riseUp 1s cubic-bezier(.22,1,.36,1) forwards;}
.podium-col.pos-1{animation-delay:.4s;flex:1.18;}
.podium-col.pos-2{animation-delay:.15s;}
.podium-col.pos-3{animation-delay:.6s;}
@keyframes riseUp{to{transform:translateY(0);opacity:1;}}
.podium-name{font-size:12.5px;font-weight:800;margin-bottom:8px;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
.podium-block{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:22px;font-weight:900;color:rgba(0,0,0,.42);box-shadow:0 -4px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.3);position:relative;}
.podium-block::after{content:'';position:absolute;inset:0;border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,transparent 45%);pointer-events:none;}
.podium-block.gold{height:180px;background:linear-gradient(180deg,#FFE066 0%,#FFD700 30%,#DAA520 100%);}
.podium-block.silver{height:135px;background:linear-gradient(180deg,#EFEFEF 0%,#C0C0C0 40%,#9A9A9A 100%);}
.podium-block.bronze{height:100px;background:linear-gradient(180deg,#EBA97C 0%,#CD7F32 40%,#9F5F26 100%);}
.podium-ok{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:7;padding:13px 38px;border-radius:14px;background:var(--accent);color:var(--accent-contrast);border:none;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 55%,transparent);animation:upIn .7s 1.2s both;}

.bracket-match.final-match-card{display:flex;flex-direction:column;padding:0;}
.final-match-card .bracket-team{padding:11px 14px;font-size:13px;}
.final-match-card .play-final-btn{background:var(--accent);color:var(--accent-contrast);border:none;padding:11px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit;letter-spacing:.05em;border-top:1px solid var(--border);transition:.15s;}
.final-match-card .play-final-btn:active{background:color-mix(in srgb,var(--accent) 75%,#000);}
.final-match-card .play-final-btn:disabled{opacity:.5;cursor:not-allowed;background:var(--card2);color:var(--muted);}

<script>
"use strict";

/* ============ CONSTANTS ============ */
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const BUILTIN_PRESETS=[

  {key:'weekdays',name:'Дни недели',teams:WEEKDAYS},
  {key:'zodiac',name:'Знаки зодиака',teams:ZODIAC},
  {key:'planets',name:'Планеты',teams:PLANETS},
  {key:'greek',name:'Греческий алфавит',teams:GREEK}
];
const ZONE_TYPES={
  playoff:{label:'Плей-офф',color:'#22c55e'},
  styk:{label:'Стыковые матчи',color:'#f59e0b'},
  releg:{label:'Вылет',color:'#ef4444'}
};
const MODES={
  classic:{key:'classic',icon:'⚽',title:'Классический',desc:'Круговой турнир + стыковые + плей-офф'},
  worldcup:{key:'worldcup',icon:'🏆',title:'Режим ЧМ',desc:'Группы по 4 + плей-офф'},
  lch:{key:'lch',icon:'⭐',title:'Режим ЛЧ',desc:'Единая лига + стыковые + плей-офф'}
};
const ACCENTS=['#22c55e','#3b82f6','#f59e0b','#ef4444','#a855f7','#14b8a6'];

const FORMATIONS = {
  '3v3': [
    {role:'gk',  name:'Вратарь',      short:'ВР', x:0.06, y:0.50},
    {role:'mid', name:'Центральный',  short:'ЦН', x:0.32, y:0.50},

  ],
  '5v5': [
    {role:'gk',  name:'Вратарь',      short:'ВР', x:0.05, y:0.50},
    {role:'def', name:'Защитник 1',   short:'ЗЩ', x:0.20, y:0.28},
    {role:'def', name:'Защитник 2',   short:'ЗЩ', x:0.20, y:0.72},
    {role:'fwd', name:'Нападающий 1', short:'НАП',x:0.52, y:0.34},
    {role:'fwd', name:'Нападающий 2', short:'НАП',x:0.52, y:0.66}
  ],
  '7v7': [
    {role:'gk',  name:'Вратарь',      short:'ВР', x:0.04, y:0.50},
    {role:'def', name:'Защитник 1',   short:'ЗЩ', x:0.18, y:0.26},
    {role:'def', name:'Защитник 2',   short:'ЗЩ', x:0.18, y:0.74},
    {role:'mid', name:'Полузащитник 1',short:'ПЗ',x:0.38, y:0.32},
    {role:'mid', name:'Полузащитник 2',short:'ПЗ',x:0.38, y:0.68},
    {role:'fwd', name:'Нападающий 1', short:'НАП',x:0.58, y:0.36},
    {role:'fwd', name:'Нападающий 2', short:'НАП',x:0.58, y:0.64}
  ]
};

const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let settings=Object.assign({theme:'dark',accent:'#22c55e'},LS.get('ft_settings',{}));
let customPresets=LS.get('ft_presets',[]);
if(!Array.isArray(customPresets))customPresets=[];

const state={
  screen:'menu',
  tab:'table',
  round:1,
  wiz:null,
  tournament:LS.get('ft_tournament',null),
  matchWiz:null,
  matchResult:null
};

/* ============ UTILS ============ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pow2Floor(n){let p=1;while(p*2<=n)p*=2;return p;}
function pow2Ceil(n){let p=1;while(p<n)p*=2;return p;}
function contrastColor(hex){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)/255>0.62?'#06120a':'#ffffff';}catch(e){return '#06120a';}}
function applyTheme(){
  document.documentElement.dataset.theme=settings.theme;
  document.documentElement.style.setProperty('--accent',settings.accent);
  document.documentElement.style.setProperty('--accent-contrast',contrastColor(settings.accent));
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',settings.theme==='dark'?'#0a1018':'#eef2f8');
}
function roundName(size){
  if(size<=2)return 'Финал';
  if(size===4)return '1/2 финала';
  if(size===8)return '1/4 финала';
  if(size===16)return '1/8 финала';
  return '1/'+(size/2)+' финала';
}
function numRounds(n,circles){if(n<2)return 0;const per=(n%2===0)?n-1:n;return per*circles;}
function seedPairs(n){
  let arr=[1];
  while(arr.length<n){const len=arr.length*2,next=[];for(const s of arr){next.push(s);next.push(len+1-s);}arr=next;}
  const pairs=[];for(let i=0;i<arr.length;i+=2)pairs.push([arr[i],arr[i+1]]);
  return pairs;
}
function generateSchedule(n,circles){
  const base=[];for(let i=0;i<n;i++)base.push(i);
  if(n%2===1)base.push(-1);
  const size=base.length,roundsPerCircle=size-1,half=size/2;
  let arr=base.slice();const out=[];let roundNo=1;
  for(let c=0;c<circles;c++){
    for(let r=0;r<roundsPerCircle;r++){
      const matches=[];
      for(let i=0;i<half;i++){
        const A=arr[i],B=arr[size-1-i];
        if(A===-1||B===-1)continue;
        const flip=(c%2===1);
        matches.push({h:flip?B:A,a:flip?A:B,hg:null,ag:null,p:false});
      }
      out.push({round:roundNo++,circle:c+1,matches});
      const last=arr[size-1];
      for(let i=size-1;i>1;i--)arr[i]=arr[i-1];
      arr[1]=last;
    }
  }
  return out;
}
function computeStandingsFromSchedule(schedule,teamIds,teams){
  const map={};
  teamIds.forEach(id=>{map[id]={teamId:id,name:teams[id],p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0};});
  for(const r of schedule){
    for(const m of r.matches){
      if(!m.p)continue;
      const h=map[m.h],a=map[m.a];
      if(!h||!a)continue;
      h.p++;a.p++;
      h.gf+=m.hg;h.ga+=m.ag;a.gf+=m.ag;a.ga+=m.hg;
      if(m.hg>m.ag){h.w++;a.l++;h.pts+=3;}
      else if(m.hg<m.ag){a.w++;h.l++;a.pts+=3;}
      else{h.d++;a.d++;h.pts++;a.pts++;}
    }
  }
  const st=Object.values(map);
  st.forEach(s=>s.gd=s.gf-s.ga);
  st.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||x.name.localeCompare(y.name,'ru'));
  return st;
}
function computeStandings(t){return computeStandingsFromSchedule(t.schedule,t.teams.map((_,i)=>i),t.teams);}
function matchWinner(m){
  if(!m)return null;
  if(m.h==null && m.a==null)return null;
  if(m.h==null)return m.a;
  if(m.a==null)return m.h;
  if(m.hg==null||m.ag==null)return null;
  if(m.hg>m.ag)return m.h;
  if(m.ag>m.hg)return m.a;
  if(m.ph!=null&&m.pa!=null&&m.ph!==m.pa)return m.ph>m.pa?m.h:m.a;
  return null;
}

/* ============ MATCH CREATOR WIZARD STATE ============ */
function newMatchWiz(){
  return {
    step: 1,
    name: 'Товарищеский Матч',
    homeName: 'Красные',
    awayName: 'Синие',
    format: '5v5',
    homePlayers: [],
    awayPlayers: [],
    importText: ''
  };
}

function initMatchPlayers(mw){
  const f = FORMATIONS[mw.format];
  const count = f.length;
  if(!Array.isArray(mw.homePlayers) || mw.homePlayers.length !== count){
    mw.homePlayers = f.map((item, idx) => `Игрок А${idx+1}`);
  }
  if(!Array.isArray(mw.awayPlayers) || mw.awayPlayers.length !== count){
    mw.awayPlayers = f.map((item, idx) => `Игрок Б${idx+1}`);
  }
}

function areAllMatchNamesFilled(mw){
  if(!mw) return false;
  const f = FORMATIONS[mw.format];
  if(!mw.homePlayers || !mw.awayPlayers) return false;
  if(mw.homePlayers.length !== f.length || mw.awayPlayers.length !== f.length) return false;
  const hFilled = mw.homePlayers.every(p => String(p||'').trim().length > 0);
  const aFilled = mw.awayPlayers.every(p => String(p||'').trim().length > 0);
  return hFilled && aFilled;
}

/* ============ WIZARD ============ */
function defaultZones(n){
  const z=[];
  if(n>=4)z.push({type:'playoff',from:1,to:Math.max(2,Math.ceil(n/2)-1)});
  if(n>=6)z.push({type:'styk',from:Math.ceil(n/2),to:n});
  return z;
}
function newWiz(){
  const teams=MONTHS.slice();
  return{step:1,mode:'classic',name:'Мой турнир',presetKey:'months',teams,circles:1,zones:defaultZones(teams.length),newPresetName:''};
}
function findPreset(key){
  if(!key)return null;
  const b=BUILTIN_PRESETS.find(p=>p.key===key);if(b)return b;
  if(key.indexOf('custom:')===0){const i=+key.slice(7);const p=customPresets[i];if(p)return{key,name:p.name,teams:p.teams};}
  return null;
}
function validateZones(zones,n){
  const errs=[];
  zones.forEach(z=>{
    const nm=ZONE_TYPES[z.type]?ZONE_TYPES[z.type].label:'Зона';
    if(!Number.isFinite(z.from)||!Number.isFinite(z.to)){errs.push(nm+': некорректные значения');return;}
    if(z.from<1||z.to>n||z.from>z.to)errs.push(nm+': места 1–'+n+', «от» ≤ «до»');
  });
  const sorted=zones.slice().sort((a,b)=>a.from-b.from);
  for(let i=0;i<sorted.length-1;i++){
    if(sorted[i].to>=sorted[i+1].from){
      const A=ZONE_TYPES[sorted[i].type]?ZONE_TYPES[sorted[i].type].label:'Зона';
      const B=ZONE_TYPES[sorted[i+1].type]?ZONE_TYPES[sorted[i+1].type].label:'Зона';
      errs.push('Пересечение: «'+A+'» и «'+B+'»');
    }
  }
  return errs;
}

function renderMatchCreator(){
  const mw = state.matchWiz;
  const titles = ['Параметры матча', 'Расстановка и имена игроков', 'Экспорт и старт'];
  let body = '';
  if(mw.step === 1) body = stepMatchConfig();

  else body = stepMatchExport();

  const allFilled = areAllMatchNamesFilled(mw);
  const canNext = mw.step !== 2 || allFilled;

  return `

    <div class="topbar-title">${titles[mw.step-1]}</div>
    <div style="width:40px"></div>
  </div>

  ${body}
  <div class="nav-row">
    ${mw.step>1?'<button class="btn" data-act="match-wiz-prev">Назад</button>':''}
    ${mw.step<3
      ?`<button class="btn primary" data-act="match-wiz-next" ${canNext?'':'disabled'}>Далее</button>`
      :`<button class="btn primary" data-act="match-wiz-start">⚽ Начать матч</button>`}
  </div>`;
}

function stepMatchConfig(){
  const mw = state.matchWiz;
  return `
  <div class="card">
    <label class="lbl">Название матча</label>
    <input data-act="match-name" value="${esc(mw.name)}" placeholder="Например: Финал Кубка">
  </div>
  <div class="card">
    <label class="lbl">Команды</label>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;">
        <span style="font-size:12px;color:#ef4444;font-weight:700;">Красные (Дома)</span>
        <input data-act="match-home" value="${esc(mw.homeName)}" placeholder="Красные">
      </div>
      <div style="flex:1;">
        <span style="font-size:12px;color:#3b82f6;font-weight:700;">Синие (В гостях)</span>
        <input data-act="match-away" value="${esc(mw.awayName)}" placeholder="Синие">
      </div>
    </div>
  </div>
  <div class="card">
    <label class="lbl">Формат матча</label>
    <div class="format-grid">
      ${['3v3','5v5','7v7'].map(fmt=>`
        <button class="format-btn ${mw.format===fmt?'active':''}" data-act="set-match-fmt" data-fmt="${fmt}">
          ${fmt}
          <span>${fmt==='3v3'?'ВР, ЦН, НАП':fmt==='5v5'?'ВР, 2ЗЩ, 2НАП':'ВР, 2ЗЩ, 2ПЗ, 2НАП'}</span>

  <div class="card">

    <textarea rows="3" data-act="match-import-text" placeholder='{"name":"Матч", "format":"5v5", ...}'></textarea>
    <button class="btn small" data-act="do-match-import" style="margin-top:8px;">📥 Загрузить и применить</button>
  </div>`;
}

function stepMatchFormation(){
  const mw = state.matchWiz;
  initMatchPlayers(mw);
  const f = FORMATIONS[mw.format];
  const allFilled = areAllMatchNamesFilled(mw);

  const homeDots = f.map((pos, idx) => {
    const left = (pos.x * 100).toFixed(1);
    const top = (pos.y * 100).toFixed(1);
    const name = mw.homePlayers[idx] || '';
    return `<div class="p-dot team-0" style="left:${left}%;top:${top}%;" title="${pos.name}: ${name}">
      ${pos.short}
      <span class="p-lbl">${esc(name.substring(0,8))}</span>
    </div>`;
  }).join('');

  const awayDots = f.map((pos, idx) => {
    const left = ((1 - pos.x) * 100).toFixed(1);
    const top = (pos.y * 100).toFixed(1);
    const name = mw.awayPlayers[idx] || '';
    return `<div class="p-dot team-1" style="left:${left}%;top:${top}%;" title="${pos.name}: ${name}">
      ${pos.short}
      <span class="p-lbl">${esc(name.substring(0,8))}</span>
    </div>`;
  }).join('');

  return `
  <div class="pitch-preview-wrap">
    <div class="pitch-preview-lines"></div>
    ${homeDots}
    ${awayDots}
  </div>

  <div class="card">
    <label class="lbl" style="color:#ef4444;">Имена игроков: ${esc(mw.homeName)} (Красные)</label>
    ${f.map((pos, idx) => `
      <div class="player-input-row">
        <span class="badge team-0">${pos.short}</span>
        <input type="text" data-act="m-player-h" data-i="${idx}" value="${esc(mw.homePlayers[idx]||'')}" placeholder="${pos.name}">
      </div>`).join('')}
  </div>

  <div class="card">
    <label class="lbl" style="color:#3b82f6;">Имена игроков: ${esc(mw.awayName)} (Синие)</label>
    ${f.map((pos, idx) => `
      <div class="player-input-row">
        <span class="badge team-1">${pos.short}</span>
        <input type="text" data-act="m-player-a" data-i="${idx}" value="${esc(mw.awayPlayers[idx]||'')}" placeholder="${pos.name}">
      </div>`).join('')}
  </div>

  ${!allFilled ? `<div class="alert">⚠️ Укажите имена абсолютно всем игрокам обеих команд, чтобы продолжить!</div>` : `<div class="ok">✓ Все имена игроков заполнены!</div>`}
  `;
}

function stepMatchExport(){
  const mw = state.matchWiz;
  const payload = {
    v: 1,
    name: mw.name,
    format: mw.format,
    homeName: mw.homeName,
    awayName: mw.awayName,
    homePlayers: mw.homePlayers,
    awayPlayers: mw.awayPlayers
  };
  const jsonStr = JSON.stringify(payload, null, 2);

  return `
  <div class="card">
    <h3 class="card-title">⚽ Всё готово к началу!</h3>
    <div class="kv"><span>Матч</span><b>${esc(mw.name)}</b></div>
    <div class="kv"><span>Формат</span><b>${mw.format}</b></div>
    <div class="kv"><span>Команда 1</span><b style="color:#ef4444;">${esc(mw.homeName)} (${mw.homePlayers.length} игр.)</b></div>
    <div class="kv"><span>Команда 2</span><b style="color:#3b82f6;">${esc(mw.awayName)} (${mw.awayPlayers.length} игр.)</b></div>
  </div>
  <div class="card">
    <label class="lbl">Экспорт конфигурации матча</label>
    <p class="hint" style="margin-top:0;margin-bottom:8px;">Скопируйте этот код, чтобы сохранить или передать матч:</p>
    <textarea rows="6" readonly id="match-export-area">${esc(jsonStr)}</textarea>
    <button class="btn small" data-act="copy-match-export" style="margin-top:9px;">📋 Скопировать код матча</button>
  </div>`;
}

/* ============ MATCH RESULT SCREEN ============ */
function renderMatchResult(){

  if(!r){ state.screen = 'menu'; return renderMenu(); }

  const eventsHtml = (r.events && r.events.length) ? r.events.map(ev => `
    <div class="kv" style="border-bottom:1px solid var(--border);padding:9px 0;">
      <span><b style="color:var(--accent);margin-right:6px;">${ev.minute}'</b> ${ev.isOwn ? '🔴 АВТОГОЛ' : '⚽ ГОЛ'} (${esc(ev.playerName)})</span>
      <b style="color:${ev.team===0?'#ef4444':'#3b82f6'};">${esc(ev.teamName)}</b>
    </div>
  `).join('') : '<p class="hint">В матче не было забитых мячей</p>';

  return `
  <div class="topbar">
    <div class="topbar-title">Результат матча</div>
  </div>
  <div class="card center" style="padding:24px 14px;">
    <div class="muted" style="font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;">${esc(r.name)}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0;">
      <div style="flex:1;text-align:right;font-size:18px;font-weight:800;color:#ef4444;">${esc(r.homeName)}</div>
      <div style="font-size:38px;font-weight:900;line-height:1;background:var(--card2);padding:8px 16px;border-radius:14px;border:1px solid var(--border);">
        ${r.homeScore} : ${r.awayScore}
      </div>
      <div style="flex:1;text-align:left;font-size:18px;font-weight:800;color:#3b82f6;">${esc(r.awayName)}</div>
    </div>
    ${r.penaltyHome!=null ? `<div class="muted" style="font-weight:700;">Серия пенальти: ${r.penaltyHome} : ${r.penaltyAway}</div>` : ''}
  </div>

  <div class="card">
    <label class="lbl">Авторы голов</label>
    ${eventsHtml}

  <button class="btn primary" data-act="to-menu" style="margin-top:14px;">🏠 В главное меню</button>
  `;
}

/* ============ WIZARD RENDER ============ */
function renderCreate(){
  const w=state.wiz;
  const titles=['Режим','Команды','Формат','Обзор'];
  let body='';
  if(w.step===1)body=stepMode();
  else if(w.step===2)body=stepTeams();
  else if(w.step===3)body=stepFormat();
  else body=stepReview();
  const errs=validateZones(w.zones,w.teams.length);
  const canNext=w.step<3||(w.step===3&&(w.mode!=='classic'||errs.length===0));
  return `
  <div class="topbar">
    <button class="icon-btn" data-act="wiz-back">←</button>
    <div class="topbar-title">${titles[w.step-1]}</div>
    <div style="width:40px"></div>
  </div>
  <div class="dots">${[1,2,3,4].map(i=>`<span class="${i<=w.step?'on':''}"></span>`).join('')}</div>
  ${body}
  <div class="nav-row">
    ${w.step>1?'<button class="btn" data-act="wiz-prev">Назад</button>':''}
    ${w.step<4
      ?`<button class="btn primary" data-act="wiz-next" ${canNext?'':'disabled'}>Далее</button>`
      :`<button class="btn primary" data-act="wiz-create">Начать турнир</button>`}
  </div>`;
}

function stepMode(){
  const w=state.wiz;
  const presets=BUILTIN_PRESETS.concat(customPresets.map((p,i)=>({key:'custom:'+i,name:p.name,teams:p.teams})));
  return `
  <div class="card">
    <label class="lbl">Режим турнира</label>
    <div class="mode-grid">
      ${Object.keys(MODES).map(k=>`
        <button class="mode-btn ${w.mode===k?'active':''}" data-act="set-mode" data-mode="${k}">
          <span class="mi">${MODES[k].icon}</span>
          <span class="mt"><b>${MODES[k].title}</b><span>${MODES[k].desc}</span></span>
          <span class="mc">${w.mode===k?'✓':''}</span>
        </button>`).join('')}
    </div>
  </div>
  <div class="card">
    <label class="lbl">Название турнира</label>
    <input data-act="wiz-name" value="${esc(w.name)}" placeholder="Например: Зимний кубок">
  </div>
  <div class="card">
    <label class="lbl">Пресет команд</label>
    <div class="preset-grid">
      ${presets.map(p=>`
        <button class="preset ${w.presetKey===p.key?'active':''}" data-act="preset" data-key="${esc(p.key)}">
          <b>${esc(p.name)}</b><span>${p.teams.length} ком.</span>
        </button>`).join('')}
    </div>
  </div>`;
}

function stepTeams(){
  const w=state.wiz;
  return `
  <div class="card">
    <label class="lbl">Количество участников</label>
    <div class="counter">
      <button class="icon-btn" data-act="count-dec">−</button>
      <input type="number" min="2" max="32" value="${w.teams.length}" data-act="team-count">
      <button class="icon-btn" data-act="count-inc">+</button>
    </div>
    <p class="hint">От 2 до 32 команд.</p>
  </div>
  <div class="card">
    <label class="lbl">Названия команд</label>
    <div class="team-list">
      ${w.teams.map((t,i)=>`
        <div class="team-row">
          <span class="num">${i+1}</span>
          <input value="${esc(t)}" data-act="team-name" data-i="${i}" placeholder="Команда ${i+1}">
        </div>`).join('')}
    </div>
    <div class="row-btns">
      <button class="btn small" data-act="shuffle">🔀 Перемешать</button>
      <button class="btn small" data-act="reset-names">↺ Сбросить</button>
    </div>
  </div>
  <div class="card">
    <label class="lbl">Быстрая загрузка списка</label>
    <textarea rows="4" data-act="bulk" placeholder="Одна команда в строке"></textarea>
    <button class="btn small" data-act="load-bulk" style="margin-top:9px">Загрузить список</button>
    <hr class="sep">
    <label class="lbl">Создать свой пресет</label>
    <input data-act="preset-name" placeholder="Название пресета" value="${esc(w.newPresetName)}">
    <button class="btn small" data-act="save-preset" style="margin-top:9px">💾 Сохранить список</button>
  </div>`;
}

function stepFormat(){
  const w=state.wiz,n=w.teams.length;
  const errs=validateZones(w.zones,n);
  const total=(n*(n-1)/2)*w.circles;
  if(w.mode==='classic'){
    return `
    <div class="card">
      <label class="lbl">Количество кругов</label>
      <p class="hint">Сколько раз каждая команда сыграет с каждой (1–54).</p>
      <div class="counter" style="margin-top:10px">
        <button class="icon-btn" data-act="circ-dec">−</button>
        <input type="number" min="1" max="54" value="${w.circles}" data-act="circles">
        <button class="icon-btn" data-act="circ-inc">+</button>
      </div>
      <input type="range" min="1" max="54" value="${w.circles}" data-act="circ-range" style="margin-top:12px">
      <div class="stat-line">Туров: <b>${numRounds(n,w.circles)}</b> · Матчей: <b>${total}</b></div>
    </div>
    <div class="card">
      <label class="lbl">Зоны мест</label>
      <p class="hint" style="margin-bottom:12px">Плей-офф — напрямую. Стыковые — играют между собой, 50% победителей идут в плей-офф. Вылет — выбывают.</p>
      <div class="zones">
        ${w.zones.length?w.zones.map((z,i)=>`
          <div class="zone-row">
            <select data-act="zone-type" data-i="${i}">
              ${Object.keys(ZONE_TYPES).map(k=>`<option value="${k}" ${z.type===k?'selected':''}>${ZONE_TYPES[k].label}</option>`).join('')}
            </select>
            <input type="number" min="1" max="${n}" value="${z.from}" data-act="zone-from" data-i="${i}">
            <span class="dash">–</span>
            <input type="number" min="1" max="${n}" value="${z.to}" data-act="zone-to" data-i="${i}">
            <button class="icon-btn del" data-act="zone-del" data-i="${i}">✕</button>
          </div>`).join(''):'<p class="hint">Зоны не заданы</p>'}
      </div>
      <button class="btn small" data-act="zone-add">+ Добавить зону</button>
      ${errs.length?`<div class="alert">${errs.map(e=>'<div>⚠️ '+esc(e)+'</div>').join('')}</div>`:'<div class="ok">✓ Диапазоны корректны</div>'}
    </div>`;
  }
  if(w.mode==='worldcup'){
    const numGroups=Math.max(2,Math.ceil(n/4));
    const qualifiers=numGroups*2;
    const ko=pow2Ceil(qualifiers);
    return `
    <div class="card">
      <label class="lbl">Формат ЧМ</label>
      <div class="kv"><span>Команд</span><b>${n}</b></div>
      <div class="kv"><span>Групп</span><b>${numGroups} × ~4</b></div>
      <div class="kv"><span>Выходят из группы</span><b>по 2 лучших</b></div>
      <div class="kv"><span>Всего в плей-офф</span><b>${qualifiers}</b></div>
      <div class="kv"><span>Сетка плей-офф</span><b>${roundName(ko)} (${ko} команд)</b></div>
    </div>`;
  }
  const K=Math.max(4,pow2Floor(Math.floor(n/2)));
  const direct=K/2;
  return `
  <div class="card">
    <label class="lbl">Формат ЛЧ</label>
    <div class="kv"><span>Команд в лиге</span><b>${n}</b></div>
    <div class="kv"><span>Матчей в лиге</span><b>${numRounds(n,1)} (круговой)</b></div>
    <div class="kv"><span>Напрямую в 1/8</span><b>${direct}</b></div>
    <div class="kv"><span>Стыковые матчи</span><b>${K}</b></div>
    <div class="kv"><span>Проходят из стыков</span><b>${K/2}</b></div>
    <div class="kv"><span>Плей-офф</span><b>${roundName(K)} (${K})</b></div>
  </div>`;
}

function stepReview(){
  const w=state.wiz,n=w.teams.length;
  const total=(n*(n-1)/2)*w.circles;
  return `
  <div class="card">
    <h3 class="card-title">${MODES[w.mode].icon} ${esc(w.name||'Турнир')}</h3>
    <div class="kv"><span>Режим</span><b>${MODES[w.mode].title}</b></div>
    <div class="kv"><span>Команд</span><b>${n}</b></div>
    ${w.mode==='classic'?`<div class="kv"><span>Кругов</span><b>${w.circles}</b></div>
      <div class="kv"><span>Матчей всего</span><b>${total}</b></div>`:''}
  </div>
  <div class="card">
    <label class="lbl">Участники</label>
    <div class="chips">${w.teams.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
  </div>`;
}

/* ============ TOURNAMENT RENDER ============ */
function renderTournament(){
  const t=state.tournament;
  if(!t){state.screen='menu';return renderMenu();}
  const mode=t.mode||'classic';
  let tabs;
  if(mode==='worldcup')tabs=[['groups','Группы'],['playoff','Плей-офф'],['info','Инфо']];
  else if(mode==='lch')tabs=[['league','Лига'],['playoff','Плей-офф'],['info','Инфо']];
  else tabs=[['table','Таблица'],['rounds','Туры'],['playoff','Плей-офф'],['info','Инфо']];
  if(!tabs.find(x=>x[0]===state.tab))state.tab=tabs[0][0];
  let body='';
  if(state.tab==='table')body=tabTable(t);
  else if(state.tab==='rounds')body=tabRounds(t);
  else if(state.tab==='groups')body=tabGroups(t);
  else if(state.tab==='league')body=tabLeague(t);
  else if(state.tab==='playoff')body=tabPlayoff(t);
  else body=tabInfo(t);
  return `
  <div class="topbar">
    <button class="icon-btn" data-act="to-menu">←</button>
    <div class="topbar-title">${esc(t.name)}</div>
    <div style="width:40px"></div>
  </div>
  <div class="tabs">
    ${tabs.map(([k,l])=>`<button class="${state.tab===k?'active':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}
  </div>
  ${body}`;
}

function tabTable(t){
  const st=computeStandings(t);
  const rows=st.map((s,i)=>{
    const pos=i+1;
    const z=t.zones.find(z=>pos>=z.from&&pos<=z.to);
    const color=z?ZONE_TYPES[z.type].color:'transparent';
    return `<tr>
      <td class="pos"><span class="zbar" style="background:${color}"></span>${pos}</td>
      <td class="tname">${esc(s.name)}</td>
      <td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td>
      <td>${s.gf}:${s.ga}</td>
      <td class="pts">${s.pts}</td>
    </tr>`;
  }).join('');
  return `
  <div class="card" style="padding:12px 10px">
    <table class="standings">
      <thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>М</th><th>О</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  ${t.zones.length?`<div class="legend">
    ${t.zones.map(z=>`<span><i class="dot" style="background:${ZONE_TYPES[z.type].color}"></i>${ZONE_TYPES[z.type].label} (${z.from}–${z.to})</span>`).join('')}
  </div>`:''}
  ${t.playoff&&t.playoff.champion!=null?`
    <div class="card" style="text-align:center">
      <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700">Чемпион</div>
      <div style="font-size:21px;font-weight:800;margin-top:6px;color:var(--accent)">🏆 ${esc(t.teams[t.playoff.champion])}</div>
    </div>`:''}`;
}

function matchCard(m,i,ri,kind){
  const t=state.tournament;
  kind=kind||'reg';
  return `<div class="match">
    <div class="m-team">${esc(t.teams[m.h])}</div>
    <div class="m-score">
      <input type="number" inputmode="numeric" min="0" max="99" value="${m.hg==null?'':m.hg}"
        data-act="score" data-kind="${kind}" data-ri="${ri}" data-mi="${i}" data-side="hg">
      <span>:</span>
      <input type="number" inputmode="numeric" min="0" max="99" value="${m.ag==null?'':m.ag}"
        data-act="score" data-kind="${kind}" data-ri="${ri}" data-mi="${i}" data-side="ag">
    </div>
    <div class="m-team away">${esc(t.teams[m.a])}</div>
  </div>`;
}

function tabRounds(t){
  const total=t.schedule.length;
  state.round=clamp(state.round,1,total);
  const r=t.schedule[state.round-1];
  if(!r)return '<div class="card center"><p class="hint">Нет туров</p></div>';
  const played=r.matches.filter(m=>m.p).length;
  return `
  <div class="round-nav">
    <button class="icon-btn" data-act="round-prev" ${state.round<=1?'disabled':''}>‹</button>
    <div class="round-title">Тур ${r.round}<span class="muted"> / ${total}</span><small>Круг ${r.circle}</small></div>
    <button class="icon-btn" data-act="round-next" ${state.round>=total?'disabled':''}>›</button>
  </div>
  <div class="progress-line">
    <span id="round-progress">Сыграно ${played} из ${r.matches.length}</span>
    <div class="progress-btns">
      <button class="btn tiny" data-act="random-round" title="Случайно текущий тур">🎲 Тур</button>
      <button class="btn tiny" data-act="random-all" title="Случайно все туры">⚡ Всё</button>
    </div>
  </div>
  <div class="card">${r.matches.map((m,i)=>matchCard(m,i,state.round-1,'reg')).join('')}</div>
  <div class="nav-row"><button class="btn small danger" data-act="clear-round">Очистить тур</button></div>`;
}

function tabGroups(t){
  if(!t.groups)return '<div class="card center"><p class="hint">Группы не сформированы</p></div>';
  let html='';
  const allComplete=t.groups.every(g=>g.schedule.every(r=>r.matches.every(m=>m.p)));
  const totalMatches=t.groups.reduce((a,g)=>a+g.schedule.reduce((b,r)=>b+r.matches.length,0),0);
  const doneMatches=t.groups.reduce((a,g)=>a+g.schedule.reduce((b,r)=>b+r.matches.filter(m=>m.p).length,0),0);
  const totalRounds=t.groups[0]?t.groups[0].schedule.length:0;
  state.round=clamp(state.round,1,Math.max(1,totalRounds));
  html+=`<div class="round-nav">
    <button class="icon-btn" data-act="round-prev" ${state.round<=1?'disabled':''}>‹</button>
    <div class="round-title">Тур ${state.round}<span class="muted"> / ${totalRounds}</span></div>
    <button class="icon-btn" data-act="round-next" ${state.round>=totalRounds?'disabled':''}>›</button>
  </div>
  <div class="progress-line">
    <span>Сыграно ${doneMatches} из ${totalMatches}</span>
    <div class="progress-btns">
      <button class="btn tiny" data-act="random-group-round" title="Случайно текущий тур">🎲 Тур</button>
      <button class="btn tiny" data-act="random-all" title="Случайно все туры">⚡ Всё</button>
    </div>
  </div>`;
  t.groups.forEach((g,gi)=>{
    const r=g.schedule[state.round-1];if(!r)return;
    html+=`<div class="card">
      <div class="round-head"><h3>Группа ${g.name} · Тур ${r.round}</h3><span>${r.matches.filter(m=>m.p).length}/${r.matches.length}</span></div>
      ${r.matches.map((m,mi)=>`
        <div class="match">
          <div class="m-team">${esc(t.teams[m.h])}</div>
          <div class="m-score">
            <input type="number" inputmode="numeric" min="0" max="99" value="${m.hg==null?'':m.hg}"
              data-act="score" data-kind="group" data-ri="${gi}" data-mi="${mi}" data-side="hg">
            <span>:</span>
            <input type="number" inputmode="numeric" min="0" max="99" value="${m.ag==null?'':m.ag}"
              data-act="score" data-kind="group" data-ri="${gi}" data-mi="${mi}" data-side="ag">
          </div>
          <div class="m-team away">${esc(t.teams[m.a])}</div>
        </div>`).join('')}
    </div>`;
  });
  html+='<hr class="sep"><label class="lbl">Таблицы групп</label>';
  t.groups.forEach(g=>{
    const st=computeStandingsFromSchedule(g.schedule,g.teamIds,t.teams);
    const rows=st.map((s,i)=>`
      <tr class="${i<2?'qualify':''}">
        <td class="pos">${i+1}</td><td class="tname">${esc(s.name)}</td>
        <td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td>
        <td>${s.gf}:${s.ga}</td><td style="font-weight:800">${s.pts}</td>
      </tr>`).join('');
    html+=`<div class="group-card">
      <div class="group-head">Группа ${g.name}<span>${st.length} команд</span></div>
      <table class="group-table">
        <thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>М</th><th>О</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  });
  if(allComplete&&!t.knockout){
    html+=`<button class="btn primary" style="margin-top:10px" data-act="make-wc-knockout">Перейти к плей-офф</button>`;
  }
  return html;
}

function tabLeague(t){
  const st=computeStandingsFromSchedule(t.schedule,t.teams.map((_,i)=>i),t.teams);
  const totalRounds=t.schedule.length;
  state.round=clamp(state.round,1,totalRounds);
  const r=t.schedule[state.round-1];
  const played=r?r.matches.filter(m=>m.p).length:0;
  const K=Math.max(4,pow2Floor(Math.floor(t.teams.length/2)));
  const direct=K/2;
  const playoffEnd=direct+K;
  const rows=st.map((s,i)=>{
    const pos=i+1;
    let cls='';
    if(pos<=direct)cls='qualify';
    const color=pos<=direct?'#22c55e':pos<=playoffEnd?'#f59e0b':'transparent';
    return `<tr class="${cls}">
      <td class="pos"><span class="zbar" style="background:${color}"></span>${pos}</td>
      <td class="tname">${esc(s.name)}</td>
      <td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td>
      <td>${s.gf}:${s.ga}</td>
      <td class="pts">${s.pts}</td>
    </tr>`;
  }).join('');
  const allComplete=t.schedule.every(r=>r.matches.every(m=>m.p));
  return `
  <div class="card" style="padding:12px 10px">
    <div style="font-size:12px;color:var(--muted);padding:0 4px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Единая лига</div>
    <table class="standings">
      <thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>М</th><th>О</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#22c55e"></i>Напрямую в 1/8 (1–${direct})</span>
    <span><i class="dot" style="background:#f59e0b"></i>Стыковые (${direct+1}–${playoffEnd})</span>
  </div>
  <div class="round-nav">
    <button class="icon-btn" data-act="round-prev" ${state.round<=1?'disabled':''}>‹</button>
    <div class="round-title">Тур ${state.round}<span class="muted"> / ${totalRounds}</span></div>
    <button class="icon-btn" data-act="round-next" ${state.round>=totalRounds?'disabled':''}>›</button>
  </div>
  <div class="progress-line">
    <span id="round-progress">Сыграно ${played} из ${r?r.matches.length:0}</span>
    <div class="progress-btns">
      <button class="btn tiny" data-act="random-round" title="Случайно текущий тур">🎲 Тур</button>
      <button class="btn tiny" data-act="random-all" title="Случайно все туры">⚡ Всё</button>
    </div>
  </div>
  ${r?`<div class="card">${r.matches.map((m,i)=>matchCard(m,i,state.round-1,'reg')).join('')}</div>`:''}
  ${allComplete&&!t.playoff&&!t.lchPlayoff?`<button class="btn primary" style="margin-top:10px" data-act="make-lch-playoff">Сформировать стыковые матчи</button>`:''}`;
}

/* ============ BRACKET ============ */
function renderBracketMatch(t,m,kind,ri,mi,isFinal,bracket){
  const w=matchWinner(m);
  const isBye=(m.h==null||m.a==null);
  const played=(m.hg!=null&&m.ag!=null);
  const draw=played&&m.hg===m.ag&&m.ph==null;
  const hName=m.h!=null?t.teams[m.h]:'—';
  const aName=m.a!=null?t.teams[m.a]:'—';

  if(isFinal && !played && m.h!=null && m.a!=null){
    const thirdIncomplete = bracket && bracket.third && matchWinner(bracket.third)==null;
    if(thirdIncomplete){
      return `<div class="bracket-match final-match-card">
        <div class="bracket-team"><span class="bracket-name">${esc(hName)}</span></div>
        <div class="bracket-team"><span class="bracket-name">${esc(aName)}</span></div>
        <button class="play-final-btn" disabled>🔒 Сначала матч за 3-е место</button>
      </div>`;
    }
    return `<div class="bracket-match final-match-card">
      <div class="bracket-team"><span class="bracket-name">${esc(hName)}</span></div>
      <div class="bracket-team"><span class="bracket-name">${esc(aName)}</span></div>
      <button class="play-final-btn" data-act="play-final" data-bracket="${kind}" data-ri="${ri}" data-mi="${mi}">
        ▶ ФИНАЛ
      </button>
    </div>`;
  }

  return `<div class="bracket-match">
    <div class="bracket-team ${w===m.h&&m.h!=null?'win':''} ${m.h==null?'bye':''}">
      <span class="bracket-name">${esc(hName)}</span>
      ${m.h!=null
        ?`<input type="number" inputmode="numeric" min="0" max="99" value="${m.hg==null?'':m.hg}" ${isBye?'disabled':''}
            data-act="score" data-kind="${kind}" data-ri="${ri}" data-mi="${mi}" data-side="hg">`
        :`<span class="bracket-bye-mark">bye</span>`}
    </div>
    <div class="bracket-team ${w===m.a&&m.a!=null?'win':''} ${m.a==null?'bye':''}">
      <span class="bracket-name">${esc(aName)}</span>
      ${m.a!=null
        ?`<input type="number" inputmode="numeric" min="0" max="99" value="${m.ag==null?'':m.ag}" ${isBye?'disabled':''}
            data-act="score" data-kind="${kind}" data-ri="${ri}" data-mi="${mi}" data-side="ag">`
        :`<span class="bracket-bye-mark">bye</span>`}
    </div>
    ${draw?`<div class="bracket-pen">
      <span>ПЕН</span>
      <input type="number" inputmode="numeric" min="0" max="20" value="${m.ph==null?'':m.ph}"
        data-act="score" data-kind="${kind}" data-ri="${ri}" data-mi="${mi}" data-side="ph">
      <span>:</span>
      <input type="number" inputmode="numeric" min="0" max="20" value="${m.pa==null?'':m.pa}"
        data-act="score" data-kind="${kind}" data-ri="${ri}" data-mi="${mi}" data-side="pa">
    </div>`:''}
  </div>`;
}

function renderBracket(t,bracket,kind,opts){
  opts=opts||{};
  if(!bracket)return '';
  const firstCount=bracket.rounds[0].matches.length;
  const minH=Math.max(440,firstCount*82);
  const totalMatches=bracket.rounds.reduce((a,R)=>a+R.matches.length,0)+(opts.withThird&&bracket.third?1:0);
  const doneMatches=bracket.rounds.reduce((a,R)=>a+R.matches.filter(m=>matchWinner(m)!=null).length,0)
    +(opts.withThird&&bracket.third&&matchWinner(bracket.third)!=null?1:0);
  const lastRoundIdx=bracket.rounds.length-1;

  let cols=bracket.rounds.map((R,ri)=>{
    const isFinalRound=(ri===lastRoundIdx && R.matches.length===1 && kind!=='lchpo');
    const matches=R.matches.map((m,mi)=>renderBracketMatch(t,m,kind,ri,mi,isFinalRound,bracket)).join('');
    return `<div class="bracket-col">
      <div class="bracket-col-title">${esc(R.name)}</div>
      <div class="bracket-col-body">${matches}</div>
    </div>`;
  }).join('');

  let thirdHtml='';
  if(opts.withThird&&bracket.third){
    const thirdDone = matchWinner(bracket.third)!=null;
    thirdHtml=`<div class="card" style="margin-bottom:12px;border-color:color-mix(in srgb,var(--accent) 40%,var(--border))">
      <div class="round-head">
        <h3>🥉 Матч за 3-е место</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <span>${thirdDone?'✓ завершён':'— сначала заполните'}</span>
          ${!thirdDone?`<button class="btn tiny" data-act="random-third" data-bracket="${kind}">🎲 Случайно</button>`:''}
        </div>
      </div>
      ${renderBracketMatch(t,bracket.third,'third',0,0,false,bracket)}
    </div>`;
  }
  let champCol='';
  if(bracket.champion!=null){
    champCol=`<div class="bracket-col champ-col">
      <div class="bracket-col-title">🏆 Победитель</div>
      <div class="bracket-col-body">
        <div class="champion-box"><span class="crown">👑</span>${esc(t.teams[bracket.champion])}</div>
      </div>
    </div>`;
  }
  return `${thirdHtml}<div class="bracket-card">
    <div class="bracket-head">
      <h3>${esc(opts.title||'Плей-офф')}</h3>
      <div class="acts">
        <span class="progress">${doneMatches}/${totalMatches}</span>
        <button class="btn tiny" data-act="random-bracket" data-bracket="${kind}">🎲 Случайно</button>
      </div>
    </div>
    <div class="bracket-scroll">
      <div class="bracket" style="min-height:${minH}px">${cols}${champCol}</div>
    </div>
  </div>`;
}

function renderStykCard(t,styk,locked){
  const R=styk.rounds[0];
  const done=R.matches.filter(m=>matchWinner(m)!=null).length;
  return `<div class="bracket-card">
    <div class="bracket-head">
      <h3>Стыковые матчи</h3>
      <div class="acts">
        <span class="progress">${done}/${R.matches.length}</span>
        ${!locked?`<button class="btn tiny" data-act="random-bracket" data-bracket="styk">🎲 Случайно</button>`:''}
      </div>
    </div>
    <div style="padding:8px 16px 8px">
      ${R.matches.map((m,mi)=>{
        const w=matchWinner(m);
        const draw=m.hg!=null&&m.ag!=null&&m.hg===m.ag&&w==null;
        return `
          <div class="match">
            <div class="m-team ${w===m.h?'win':''}">${esc(t.teams[m.h])}</div>
            <div class="m-score">
              <input type="number" inputmode="numeric" min="0" max="99" value="${m.hg==null?'':m.hg}"
                data-act="score" data-kind="styk" data-ri="0" data-mi="${mi}" data-side="hg" ${locked?'disabled':''}>
              <span>:</span>
              <input type="number" inputmode="numeric" min="0" max="99" value="${m.ag==null?'':m.ag}"
                data-act="score" data-kind="styk" data-ri="0" data-mi="${mi}" data-side="ag" ${locked?'disabled':''}>
            </div>
            <div class="m-team away ${w===m.a?'win':''}">${esc(t.teams[m.a])}</div>
          </div>
          ${draw&&!locked?`
            <div class="bracket-pen" style="margin:-4px 0 6px">
              <span>ПЕН</span>
              <input type="number" inputmode="numeric" min="0" max="20" value="${m.ph==null?'':m.ph}"
                data-act="score" data-kind="styk" data-ri="0" data-mi="${mi}" data-side="ph">
              <span>:</span>
              <input type="number" inputmode="numeric" min="0" max="20" value="${m.pa==null?'':m.pa}"
                data-act="score" data-kind="styk" data-ri="0" data-mi="${mi}" data-side="pa">
            </div>`:''}
        `;
      }).join('')}
    </div>
  </div>`;
}

function tabPlayoff(t){
  const mode=t.mode||'classic';
  if(mode==='worldcup'){
    if(!t.knockout){
      const totalMatches=t.groups?t.groups.reduce((a,g)=>a+g.schedule.reduce((b,r)=>b+r.matches.length,0),0):0;
      const doneMatches=t.groups?t.groups.reduce((a,g)=>a+g.schedule.reduce((b,r)=>b+r.matches.filter(m=>m.p).length,0),0):0;
      const allComplete=doneMatches===totalMatches&&totalMatches>0;
      return `<div class="card"><div class="stage-intro">
        <div class="ic">🏆</div>
        <h3 style="font-size:17px;font-weight:800">Плей-офф ещё не сформирован</h3>
        <p class="hint">Завершите матчи группового этапа.</p>
        <div class="kv" style="justify-content:center;gap:14px;margin-top:10px"><span>Сыграно</span><b>${doneMatches} / ${totalMatches}</b></div>
        ${allComplete?`<button class="btn primary" style="margin-top:14px" data-act="make-wc-knockout">Сформировать плей-офф</button>`:''}
      </div></div>`;
    }
    return renderBracket(t,t.knockout,'ko',{withThird:true,title:'Плей-офф ЧМ'});
  }
  if(mode==='lch'){
    if(!t.lchPlayoff&&!t.playoff){
      const totalMatches=t.schedule.reduce((a,r)=>a+r.matches.length,0);
      const done=t.schedule.reduce((a,r)=>a+r.matches.filter(m=>m.p).length,0);
      const allComplete=done===totalMatches;
      return `<div class="card"><div class="stage-intro">
        <div class="ic">⭐</div>
        <h3 style="font-size:17px;font-weight:800">Плей-офф ещё не сформирован</h3>
        <p class="hint">Завершите матчи лигового этапа.</p>
        <div class="kv" style="justify-content:center;gap:14px;margin-top:10px"><span>Сыграно</span><b>${done} / ${totalMatches}</b></div>
        ${allComplete?`<button class="btn primary" style="margin-top:14px" data-act="make-lch-playoff">Сформировать стыковые матчи</button>`:''}
      </div></div>`;
    }
    let html='';
    if(t.lchPlayoff)html+=renderBracket(t,t.lchPlayoff,'lchpo',{withThird:false,title:'Стыковые матчи'});
    if(t.playoff)html+=renderBracket(t,t.playoff,'po',{withThird:true,title:'Плей-офф'});
    return html;
  }
  const hasZones=t.zones.some(z=>z.type==='playoff'||z.type==='styk');
  if(!t.playoff&&!t.styk){
    const total=t.schedule.reduce((a,r)=>a+r.matches.length,0);
    const done=t.schedule.reduce((a,r)=>a+r.matches.filter(m=>m.p).length,0);
    const allPlayed=done===total;
    return `<div class="card"><div class="stage-intro">
      <div class="ic">🏆</div>
      <h3 style="font-size:17px;font-weight:800">Плей-офф ещё не сформирован</h3>
      ${!hasZones?`<p class="hint">Не заданы зоны «Плей-офф» или «Стыковые матчи».</p>`
        :allPlayed?`<button class="btn primary" style="margin-top:14px" data-act="make-playoff">Сформировать стыковые и плей-офф</button>`
        :`<p class="hint">Завершите все матчи регулярного сезона.</p>`}
      <div class="kv" style="justify-content:center;gap:14px;margin-top:10px"><span>Сыграно</span><b>${done} / ${total}</b></div>
    </div></div>`;
  }
  let html='';
  if(t.styk){
    const stykDone=t.styk.rounds[0].matches.every(m=>matchWinner(m)!=null);
    html+=renderStykCard(t,t.styk,stykDone);
    if(!stykDone){
      html+=`<div class="card center">
        <p class="hint">Завершите стыковые матчи — победители добавятся к командам плей-офф.</p>
      </div>`;
    }
  }
  if(t.playoff)html+=renderBracket(t,t.playoff,'po',{withThird:true,title:'Плей-офф'});
  return html;
}

function tabInfo(t){
  const mode=t.mode||'classic';
  let played=0,total=0;
  if(mode==='worldcup'&&t.groups){
    total=t.groups.reduce((a,g)=>a+g.schedule.reduce((b,r)=>b+r.matches.length,0),0);

    total=t.schedule.reduce((a,r)=>a+r.matches.length,0);

function renderAbout(){

/* ============ CREATE ============ */
function createTournament(){
  const w=state.wiz;
  const n=w.teams.length;
  const mode=w.mode;
  if(mode==='classic'){
    const errs=validateZones(w.zones,n);
    if(errs.length){alert('Ошибки в зонах:\n'+errs.join('\n'));return;}
  }
  const teams=w.teams.map((t,i)=>((t||'').trim()||('Команда '+(i+1))));
  if(mode==='classic'){
    const schedule=generateSchedule(n,w.circles);
    state.tournament={v:6,mode:'classic',name:(w.name||'').trim()||'Турнир',teams,circles:w.circles,
      zones:w.zones.map(z=>({type:z.type,from:z.from,to:z.to})),schedule,playoff:null,styk:null,createdAt:Date.now()};
  } else if(mode==='worldcup'){
    const numGroups=Math.max(2,Math.ceil(n/4));
    const baseSize=Math.floor(n/numGroups);
    const extra=n%numGroups;
    const groups=[];
    let idx=0;
    for(let g=0;g<numGroups;g++){
      const size=baseSize+(g<extra?1:0);
      const teamIds=[];
      for(let k=0;k<size;k++)teamIds.push(idx++);
      const sch=generateSchedule(size,1);
      groups.push({name:String.fromCharCode(65+g),teamIds,schedule:sch});
    }
    state.tournament={v:6,mode:'worldcup',name:(w.name||'').trim()||'ЧМ',teams,circles:1,groups,knockout:null,createdAt:Date.now()};
  } else {
    const schedule=generateSchedule(n,1);
    state.tournament={v:6,mode:'lch',name:(w.name||'').trim()||'ЛЧ',teams,circles:1,schedule,lchPlayoff:null,playoff:null,createdAt:Date.now()};
  }
  state.round=1;
  state.tab=mode==='worldcup'?'groups':mode==='lch'?'league':'table';
  state.screen='tournament';
  saveTournament();
  render();
}

/* ============ BRACKET BUILD ============ */
function buildBracket(teamIds){
  const n=teamIds.length;
  if(n<2)return null;
  const size=pow2Ceil(n);
  const padded=teamIds.slice();
  while(padded.length<size)padded.push(null);
  const pairs=seedPairs(size);
  const matches=pairs.map(([a,b])=>({h:padded[a-1],a:padded[b-1],hg:null,ag:null,ph:null,pa:null}));
  return {size,seedCount:n,rounds:[{name:roundName(size),matches}],third:null,champion:null};
}
function checkBracketProgress(bracket,withThird){
  if(!bracket)return;
  let guard=0;
  while(guard++<20){
    const R=bracket.rounds[bracket.rounds.length-1];
    if(!R)break;
    const complete=R.matches.every(m=>matchWinner(m)!=null);
    if(!complete)break;
    if(R.matches.length===1){bracket.champion=matchWinner(R.matches[0]);break;}
    const winners=R.matches.map(m=>matchWinner(m));
    const nm=[];
    for(let k=0;k<winners.length;k+=2)nm.push({h:winners[k],a:winners[k+1],hg:null,ag:null,ph:null,pa:null});
    bracket.rounds.push({name:roundName(nm.length*2),matches:nm});
    if(withThird&&R.matches.length===2&&!bracket.third){
      const losers=R.matches.map(m=>matchWinner(m)===m.h?m.a:m.h);
      bracket.third={h:losers[0],a:losers[1],hg:null,ag:null,ph:null,pa:null};
    }
  }
}
function randomizeBracketRound(bracket,withThird){
  if(!bracket)return false;
  if(withThird && bracket.third && matchWinner(bracket.third)==null){
    let hg=Math.floor(Math.random()*5),ag=Math.floor(Math.random()*5);
    if(hg===ag){if(Math.random()<0.5)hg++;else ag++;}
    bracket.third.hg=hg;bracket.third.ag=ag;
    return true;
  }
  for(let ri=0;ri<bracket.rounds.length;ri++){
    const R=bracket.rounds[ri];
    const incomplete=R.matches.filter(m=>matchWinner(m)==null && m.h!=null && m.a!=null);
    if(incomplete.length===0)continue;
    incomplete.forEach(m=>{
      let hg=Math.floor(Math.random()*5),ag=Math.floor(Math.random()*5);
      if(hg===ag){if(Math.random()<0.5)hg++;else ag++;}
      m.hg=hg;m.ag=ag;m.ph=null;m.pa=null;
    });
    checkBracketProgress(bracket,withThird);
    return true;
  }
  return false;
}
function randomizeStykClassic(){
  const t=state.tournament;
  const R=t.styk.rounds[0];
  const incomplete=R.matches.filter(m=>matchWinner(m)==null);
  if(incomplete.length===0)return false;
  incomplete.forEach(m=>{
    let hg=Math.floor(Math.random()*5),ag=Math.floor(Math.random()*5);
    if(hg===ag){if(Math.random()<0.5)hg++;else ag++;}
    m.hg=hg;m.ag=ag;m.ph=null;m.pa=null;
  });
  checkClassicPlayoffComplete();
  return true;
}

/* ============ CLASSIC STYK ============ */
function makeClassicPlayoff(){
  const t=state.tournament;
  const st=computeStandings(t);
  const pz=t.zones.find(z=>z.type==='playoff');
  const sz=t.zones.find(z=>z.type==='styk');
  if(!pz && !sz){alert('Нужна зона «Плей-офф» или «Стыковые матчи»');return;}
  const directTeams = pz ? st.slice(pz.from-1,pz.to).map(s=>s.teamId) : [];
  const stykTeams = sz ? st.slice(sz.from-1,sz.to).map(s=>s.teamId) : [];
  if(stykTeams.length < 2){
    t.playoff = buildBracket(directTeams);
    t.styk = null;
    t.phase = 'playoff';
    saveTournament();render();return;
  }
  const cnt = stykTeams.length;
  const pairCount = Math.floor(cnt/2);
  const matches = [];
  const byeTeams = [];
  for(let i=0;i<pairCount;i++){
    matches.push({h:stykTeams[i],a:stykTeams[cnt-1-i],hg:null,ag:null,ph:null,pa:null});
  }
  if(cnt % 2 === 1)byeTeams.push(stykTeams[Math.floor(cnt/2)]);
  t.styk = {rounds:[{name:'Стыковые',matches}],third:null,champion:null,_directTeams:directTeams,_byeTeams:byeTeams};
  t.playoff = null;
  t.phase = 'playoff';
  saveTournament();render();
}
function checkClassicPlayoffComplete(){
  const t=state.tournament;
  if(t.mode!=='classic')return;
  if(!t.styk || t.playoff)return;
  const allComplete = t.styk.rounds[0].matches.every(m=>matchWinner(m)!=null);
  if(!allComplete)return;
  const winners = t.styk.rounds[0].matches.map(m=>matchWinner(m));
  const allTeams = (t.styk._directTeams||[]).concat(t.styk._byeTeams||[]).concat(winners);
  t.playoff = buildBracket(allTeams);
  saveTournament();
}
function makeWCKnockout(){
  const t=state.tournament;
  if(!t.groups)return;
  const qualifiers=[];
  t.groups.forEach(g=>{
    const st=computeStandingsFromSchedule(g.schedule,g.teamIds,t.teams);
    qualifiers.push(st[0].teamId);
    if(st[1])qualifiers.push(st[1].teamId);
  });
  const bracket=buildBracket(qualifiers);
  if(!bracket){alert('Не удалось сформировать');return;}
  t.knockout=bracket;
  saveTournament();render();
}
function makeLCHPlayoff(){
  const t=state.tournament;
  const st=computeStandingsFromSchedule(t.schedule,t.teams.map((_,i)=>i),t.teams);
  const n=t.teams.length;
  const K=Math.max(4,pow2Floor(Math.floor(n/2)));
  const direct=K/2;
  const playoffEnd=Math.min(direct+K,n);
  const directTeams=st.slice(0,direct).map(s=>s.teamId);
  const playoffTeams=st.slice(direct,playoffEnd).map(s=>s.teamId);
  const pairCount=Math.floor(playoffTeams.length/2);
  const pairs=[];
  const byeTeams=[];
  for(let i=0;i<pairCount;i++){
    pairs.push({h:playoffTeams[i],a:playoffTeams[playoffTeams.length-1-i],hg:null,ag:null,ph:null,pa:null});
  }
  if(playoffTeams.length%2===1)byeTeams.push(playoffTeams[Math.floor(playoffTeams.length/2)]);
  if(!pairs.length){
    t.playoff=buildBracket(directTeams.concat(byeTeams));
  } else {
    t.lchPlayoff={rounds:[{name:'Стыковые',matches:pairs}],third:null,champion:null,_directTeams:directTeams,_byeTeams:byeTeams};
  }
  saveTournament();render();
}
function checkLCHPlayoffComplete(){
  const t=state.tournament;
  if(!t.lchPlayoff||t.playoff)return;
  const all=t.lchPlayoff.rounds[0].matches.every(m=>matchWinner(m)!=null);
  if(!all)return;
  const winners=t.lchPlayoff.rounds[0].matches.map(m=>matchWinner(m));
  const allTeams=(t.lchPlayoff._directTeams||[]).concat(t.lchPlayoff._byeTeams||[]).concat(winners);
  t.playoff=buildBracket(allTeams);
  saveTournament();
}

/* ============ SCORE HANDLING ============ */
function tourField(act,el,isChange){
  const t=state.tournament;
  if(!t||act!=='score')return;
  const kind=el.dataset.kind;
  const ri=+el.dataset.ri,mi=+el.dataset.mi,side=el.dataset.side;

  let m=null;
  if(kind==='reg'){const r=t.schedule[ri];if(r)m=r.matches[mi];}
  else if(kind==='group'){const g=t.groups[ri];if(g){const r=g.schedule[state.round-1];if(r)m=r.matches[mi];}}
  else if(kind==='ko'){const R=t.knockout&&t.knockout.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='po'){const R=t.playoff&&t.playoff.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='styk'){const R=t.styk&&t.styk.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='lchpo'){const R=t.lchPlayoff&&t.lchPlayoff.rounds[ri];if(R)m=R.matches[mi];}
  else if(kind==='third'){const bracket=getMainBracket(t);m=bracket&&bracket.third;}
  if(!m)return;

  const raw=el.value.trim();
  if(raw==='')m[side]=null;
  else{m[side]=clamp(parseInt(raw,10)||0,0,(side==='ph'||side==='pa')?20:99);}

  if(kind==='reg'||kind==='group'){
    m.p=(m.hg!=null&&m.ag!=null);
    updateRoundProgress();
    saveTournament();
    return;
  }

  const mainBracket=getMainBracket(t);
  const champBefore=mainBracket&&mainBracket.champion;

  if(kind==='ko')checkBracketProgress(t.knockout,true);
  else if(kind==='po')checkBracketProgress(t.playoff,true);
  else if(kind==='lchpo'){checkBracketProgress(t.lchPlayoff,false);checkLCHPlayoffComplete();}
  else if(kind==='styk'){checkClassicPlayoffComplete();}

  saveTournament();
  if(isChange){
    render({keepScroll:true});
    const champAfter=mainBracket&&mainBracket.champion;
    if(champAfter!=null&&champBefore==null){
      setTimeout(()=>showPodium(t,mainBracket),400);
    }
  }
}

  w.zones=w.zones.map(z=>{let from=clamp(z.from,1,n),to=clamp(z.to,1,n);if(from>to)from=to;return{type:z.type,from,to};});
  render({keepScroll:true});
}

      <button class="btn small" data-sim-cancel style="margin-top:10px;opacity:.7;background:transparent;color:#fff;border-color:rgba(255,255,255,.2);">Отмена</button>
    </div>
  `;
  document.body.appendChild(ov);
  ov.addEventListener('click',(e)=>{
    const speedBtn=e.target.closest('[data-sim-speed]');

      const delay=parseInt(speedBtn.dataset.simSpeed,10);
      ov.remove();
      runSimulation(rounds,delay);
      return;
    }

  });

function runSimulation(rounds,delay){
  const prog=document.createElement('div');
  prog.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:inherit;padding:20px;';
  prog.innerHTML=`
    <h3 style="font-size:18px;font-weight:800;margin-bottom:14px;">Симуляция...</h3>
    <div style="width:240px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;">
      <div id="sim-bar" style="height:100%;width:0%;background:var(--accent);transition:width .05s linear;"></div>
    </div>
    <div id="sim-label" style="font-size:13px;opacity:.7;margin-top:10px;">0 / ${rounds.length}</div>
  `;
  document.body.appendChild(prog);
  const bar=document.getElementById('sim-bar');
  const label=document.getElementById('sim-label');
  let idx=0;
  const batchSize=delay===0?Math.max(1,Math.ceil(rounds.length/30)):1;
  const step=()=>{
    if(idx>=rounds.length){
      prog.remove();
      state.round=1;
      saveTournament();
      render();
      return;
    }
    for(let b=0;b<batchSize && idx<rounds.length;b++){
      const r=rounds[idx];
      r.matches.forEach(m=>{
        if(m.hg==null||m.ag==null){
          m.hg=Math.floor(Math.random()*4);
          m.ag=Math.floor(Math.random()*4);
        }
        m.p=(m.hg!=null&&m.ag!=null);
      });
      idx++;
    }
    if(bar) bar.style.width=(idx/rounds.length*100)+'%';
    if(label) label.textContent=idx+' / '+rounds.length;
    if(delay>0) setTimeout(step,delay);
    else requestAnimationFrame(step);
  };
  step();
}
