    this.homeScore = 0;
    this.awayScore = 0;
    this.gameTime = 0;
    this.isRunning = true;
    this.state = 'kickoff';
    this.stateTimer = 0;
    this.lastConcedingTeam = 0;

    this.setupTeams();
    this.setupBall();
    this.giveKickoff(0);

    this.elTime = document.getElementById('tv-minute');
    this.elHScore = document.getElementById('tv-h-score');
    this.elAScore = document.getElementById('tv-a-score');
    this.elHName = document.getElementById('tv-h-name');
    this.elAName = document.getElementById('tv-a-name');
    this.elToast = document.getElementById('final-toast');

    if(this.elHName) this.elHName.textContent = homeName.substring(0,3).toUpperCase();
    if(this.elAName) this.elAName.textContent = awayName.substring(0,3).toUpperCase();

    this.lastTime = performance.now();
    this._loop = this._loop.bind(this);
    requestAnimationFrame(this._loop);
  }

  destroy() {
    this.isRunning = false;
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('orientationchange', this._onOrientation);
    document.removeEventListener('fullscreenchange', this._onResize);
  }

  resize() {
    const parent = this.canvas.parentElement;
    if(!parent) return;
    this.canvas.width = parent.clientWidth;
    this.canvas.height = parent.clientHeight;
    this.w = this.canvas.width;
    this.h = this.canvas.height;

    const targetAR = 1.85;
    const marginX = Math.max(8, this.w * 0.012);
    const marginY = Math.max(8, this.h * 0.025);
    const availableW = this.w - marginX * 2;
    const availableH = this.h - marginY * 2;
    const pw = Math.min(availableW, availableH * targetAR);
    const ph = pw / targetAR;
    this.padX = (this.w - pw) / 2;
    this.padY = (this.h - ph) / 2;
    this.fieldW = pw;
    this.fieldH = ph;
    this.pitchCY = this.padY + this.fieldH / 2;

    this.goalH = this.fieldH * 0.22;
    this.goalDepth = 8;
    this.goalY1 = this.pitchCY - this.goalH / 2;
    this.goalY2 = this.pitchCY + this.goalH / 2;
    this.leftGoalX = this.padX;
    this.rightGoalX = this.w - this.padX;

    this.centerRadius = Math.min(this.fieldW, this.fieldH) * 0.10;
    this.boxW = this.fieldW * 0.10;
    this.boxH = this.goalH * 1.7;

    if (this.players) {
      this.players.forEach(p => {
        p.x = this.padX + p.baseX * this.fieldW;
        p.y = this.padY + p.baseY * this.fieldH;
      });
      if (this.ball) {
        this.ball.x = clamp(this.ball.x, this.padX + 4, this.w - this.padX - 4);
        this.ball.y = clamp(this.ball.y, this.padY + 4, this.padY + this.fieldH - 4);
      }
    }
  }

  setupTeams() {
    const homeColor = '#ef4444';
    const awayColor = '#3b82f6';
    const formation = FORMATIONS[this.format] || FORMATIONS['5v5'];

    this.players = [];
    formation.forEach((f, idx) => {
      const name = (this.homePlayerNames && this.homePlayerNames[idx]) ? this.homePlayerNames[idx] : `Игрок А${idx+1}`;
      this.players.push(this._makePlayer(0, f, homeColor, name));
    });
    formation.forEach((f, idx) => {
      const name = (this.awayPlayerNames && this.awayPlayerNames[idx]) ? this.awayPlayerNames[idx] : `Игрок Б${idx+1}`;
      this.players.push(this._makePlayer(1, f, awayColor, name));
    });
  }

  _makePlayer(team, f, color, name) {
    const baseX = team === 0 ? f.x : 1 - f.x;
    return {
      team, role: f.role,
      name: name,
      baseX, baseY: f.y,
      x: this.padX + baseX * this.fieldW,
      y: this.padY + f.y * this.fieldH,
      color,
      speed: f.role === 'gk' ? 76 : (f.role === 'def' ? 88 : 86),
      runTarget: null,
      runTimer: 0,
      runCooldown: 0,
      actionTimer: 0,
      tackleCooldown: 0
    };
  }

  setupBall() {
    this.ball = {
      x: this.w / 2, y: this.pitchCY,
      vx: 0, vy: 0, r: 5,
      possessor: null,
      freeTime: 0,
      lastKickTime: -999
    };
  }

  giveKickoff(team) {
    this.players.forEach(p => {
      p.x = this.padX + p.baseX * this.fieldW;
      p.y = this.padY + p.baseY * this.fieldH;
      p.runTarget = null;
      p.runTimer = 0;
      p.runCooldown = 1;
      p.actionTimer = 0;
      p.tackleCooldown = 0;
    });
    this.ball.x = this.w / 2;
    this.ball.y = this.pitchCY;
    this.ball.vx = 0; this.ball.vy = 0;
    this.ball.possessor = null;
    this.ball.freeTime = 0;
    this.ball.lastKickTime = -999;

    let bestIdx = -1, bestD = Infinity;
    this.players.forEach((p, i) => {
      if (p.team === team && p.role !== 'gk') {
        const d = Math.hypot(p.x - this.ball.x, p.y - this.ball.y);
        if (d < bestD) { bestD = d; bestIdx = i; }
      }
    });
    if (bestIdx >= 0) {
      const p = this.players[bestIdx];
      p.x = this.ball.x - (p.team === 0 ? 10 : -10);
      p.y = this.ball.y;
      this.ball.possessor = bestIdx;
      this.lastTouchIdx = bestIdx;
    }
  }

  _loop(time) {
    if(!this.isRunning) return;
    const dt = Math.min(50, time - this.lastTime);
    this.lastTime = time;
    this.update(dt);
    this.draw();
    if(this.isRunning) requestAnimationFrame(this._loop);
  }

  update(dt) {
    if(!this.isRunning) return;
    const dtSec = dt / 1000;

    let rate = 60 / this.speedMultiplier;
    if(this.state === 'play') rate *= 0.4;
    
    if(this.state !== 'goal') {
      this.gameTime += dtSec * rate;
    }
    if(this.gameTime >= 90 * 60){
      this.gameTime = 90 * 60;
      this.endMatch();
      return;
    }
    this._updateClockUI();
    this.stateTimer += dtSec;

    if(this.state === 'kickoff'){
      if(this.stateTimer > 0.6){
        this.state = 'play';
        this.stateTimer = 0;
      }
    } else if(this.state === 'play'){
      this._updatePlay(dtSec);
    } else if(this.state === 'goal'){
      if(this.stateTimer >= 3.0){
        this.giveKickoff(this.lastConcedingTeam);
        this.state = 'kickoff';
        this.stateTimer = 0;
      }
    }
  }

  _updatePlay(dtSec) {
    this.players.forEach(p => {
      if (p.runCooldown > 0) p.runCooldown -= dtSec;
      if (p.runTimer > 0) p.runTimer -= dtSec;
      if (p.actionTimer > 0) p.actionTimer -= dtSec;
      if (p.tackleCooldown > 0) p.tackleCooldown -= dtSec;
    });

    this.players.forEach((p, i) => this._updatePlayerMovement(p, i, dtSec));
    this._checkTackles();
    this._updateBall(dtSec);

    if (this.ball.possessor != null) {
      this.lastTouchIdx = this.ball.possessor;
      this._possessorDecisions(dtSec);
    }
  }

  _checkTackles() {
    const b = this.ball;
    if (b.possessor == null) return;
    const carrier = this.players[b.possessor];

    this.players.forEach((p, i) => {
      if (i === b.possessor) return;
      if (p.team === carrier.team) return;
      if (p.role === 'gk') return;
      if (p.tackleCooldown > 0) return;
      if (carrier.role === 'gk') return;

      const dist = Math.hypot(p.x - carrier.x, p.y - carrier.y);
      if (dist < 16) {
        p.tackleCooldown = 0.8;
        if (Math.random() < 0.65) {
          b.possessor = i;
          this.lastTouchIdx = i;
          b.x = p.x + (p.team === 0 ? 8 : -8);
          b.y = p.y;
          b.vx = 0;
          b.vy = 0;
          b.lastKickTime = performance.now();
          carrier.actionTimer = 0.4;
          p.runTarget = null;
          p.runTimer = 0;
        }
      }
    });
  }

  _updatePlayerMovement(p, idx, dtSec) {
    const b = this.ball;
    const possessorTeam = b.possessor != null ? this.players[b.possessor].team : -1;
    const teamHasBall = possessorTeam === p.team;
    const isPossessor = idx === b.possessor;
    const ballFree = b.possessor == null;

    if (isPossessor) {
      if (p.role === 'gk') return;
      this._moveWithBall(p, dtSec);
      return;
    }

    let target;

    // === ПОВЕДЕНИЕ ВРАТАРЯ ===
    if (p.role === 'gk') {
      const isHome = p.team === 0;
      const ownGoalX = isHome ? this.padX + 14 : this.w - this.padX - 14;
      const ballComing = isHome ? (b.vx < -30) : (b.vx > 30);
      const ballInMyHalf = isHome ? (b.x < this.w * 0.45) : (b.x > this.w * 0.55);

      if (ballFree && ballInMyHalf && Math.abs(b.x - ownGoalX) < this.fieldW * 0.22) {
        target = { x: b.x, y: b.y };
      } else if (ballComing) {
        target = {
          x: ownGoalX + (isHome ? 12 : -12),
          y: clamp(b.y + (b.vy * 0.25), this.goalY1 + 2, this.goalY2 - 2)
        };
      } else {
        target = {
          x: ownGoalX,
          y: clamp(b.y, this.goalY1 + 4, this.goalY2 - 4)
        };
      }
      this._moveToward(p, target.x, target.y, dtSec);
      return;
    }

    // === ПОВЕДЕНИЕ ПОЛЕВЫХ ИГРОКОВ ===
    if (ballFree) {
      target = this._getLooseBallTarget(p, idx);
    } else if (teamHasBall) {
      target = this._getAttackPosition(p);
    } else {
      target = this._getDefendPosition(p);
    }

    this._moveToward(p, target.x, target.y, dtSec);
  }

  _getLooseBallTarget(p, idx) {
    const b = this.ball;
    const isHome = p.team === 0;
    const forwardDir = isHome ? 1 : -1;

    let closestIdx = -1, closestDist = Infinity;
    let myTeamClosestDist = Infinity;

    this.players.forEach((op, i) => {
      const d = Math.hypot(op.x - b.x, op.y - b.y);
      if (d < closestDist) { closestDist = d; closestIdx = i; }
      if (op.team === p.team && d < myTeamClosestDist) { myTeamClosestDist = d; }
    });

    const myDist = Math.hypot(p.x - b.x, p.y - b.y);
    const iAmClosestInTeam = (myDist <= myTeamClosestDist + 1);
    const closestPlayer = this.players[closestIdx];
    const willMyTeamGetBall = closestPlayer && closestPlayer.team === p.team;

    if (iAmClosestInTeam) {
      return { x: b.x + b.vx * 0.15, y: b.y + b.vy * 0.15 };
    }

    if (willMyTeamGetBall) {
      if (p.role === 'fwd') {
        return {
          x: clamp(b.x + forwardDir * 90, this.padX + 40, this.w - this.padX - 40),
          y: clamp(p.baseY * this.fieldH + this.padY + (Math.random() - 0.5) * 50, this.padY + 20, this.padY + this.fieldH - 20)
        };
      }
      if (p.role === 'mid') {
        return {
          x: clamp(b.x + forwardDir * 35, this.padX + 50, this.w - this.padX - 50),
          y: this.pitchCY + (p.baseY - 0.5) * this.fieldH * 0.6
        };
      }
    }

    const base = this._getBasePosition(p);
    return {
      x: base.x * 0.6 + b.x * 0.4,
      y: base.y * 0.6 + b.y * 0.4
    };
  }

  _getBasePosition(p) {
    return {
      x: this.padX + p.baseX * this.fieldW,
      y: this.padY + p.baseY * this.fieldH
    };
  }

  _getAttackPosition(p) {
    const isHome = p.team === 0;
    const dir = isHome ? 1 : -1;
    const b = this.ball;

    const base = this._getBasePosition(p);
    const ballInOwnHalf = isHome ? (b.x < this.w/2) : (b.x > this.w/2);

    if (p.role === 'def') {
      if (ballInOwnHalf) {
        const maxX = isHome ? this.w * 0.40 : this.w * 0.60;
        const proposedX = base.x + dir * this.fieldW * 0.18;
        return {
          x: isHome ? Math.min(proposedX, maxX) : Math.max(proposedX, maxX),
          y: base.y + (b.y - base.y) * 0.15
        };
      }
      return base;
    }

    if (p.role === 'mid') {
      if (p.runTimer > 0 && p.runTarget) return p.runTarget;

      if (p.runCooldown <= 0 && Math.random() < 0.055) {
        const run = this._findRunSpace(p);
        if (run) {
          p.runTarget = run;
          p.runTimer = run.duration;
          p.runCooldown = run.duration + 3.0;
          return run;
        }
      }

      const attackGoalX = isHome ? this.rightGoalX : this.leftGoalX;
      const supportX = p.x + (attackGoalX - p.x) * 0.18;
      const supportY = p.y + (b.y - p.y) * 0.15;
      return {
        x: clamp(supportX, this.padX + 60, this.w - this.padX - 60),
        y: clamp(supportY + (p.baseY-0.5)*this.fieldH*0.22, this.padY + 30, this.padY + this.fieldH - 30)
      };
    }

    if (p.role === 'fwd') {
      if (p.runTimer > 0 && p.runTarget) return p.runTarget;

      if (p.runCooldown <= 0 && Math.random() < 0.075) {
        const run = this._findRunSpace(p);
        if (run) {
          p.runTarget = run;
          p.runTimer = run.duration;
          p.runCooldown = run.duration + 2.5;
          return run;
        }
      }

      const open = this._findOpenAttackSpace(p);
      if (open) {
        return {
          x: base.x * 0.5 + open.x * 0.5,
          y: base.y * 0.5 + open.y * 0.5
        };
      }
      return {
        x: base.x + dir * this.fieldW * 0.10,
        y: base.y + (b.y - base.y) * 0.2
      };
    }

    return base;
  }

  _findRunSpace(p) {
    const isHome = p.team === 0;
    const goalX = isHome ? this.rightGoalX - 60 : this.leftGoalX + 60;
    const goalY = this.pitchCY;

    let best = null, bestScore = 0;
    for (let i = 0; i < 6; i++) {
      const x = p.x + (goalX - p.x) * (0.35 + i * 0.1);
      const y = goalY + (Math.random() - 0.5) * this.goalH * 2.2;
      if (x < this.padX + 40 || x > this.w - this.padX - 40) continue;
      if (y < this.padY + 25 || y > this.h - this.padY - 25) continue;

      let minOppD = Infinity;
      this.players.forEach(op => {
        if (op.team === p.team) return;
        const d = Math.hypot(op.x - x, op.y - y);
        if (d < minOppD) minOppD = d;
      });
      if (minOppD < 45) continue;

      const progress = isHome ? (x - p.x) : (p.x - x);
      const score = minOppD * 1.5 + progress * 0.6;
      if (score > bestScore) {
        bestScore = score;
        const dist = Math.hypot(x - p.x, y - p.y);
        const duration = Math.min(2.5, dist / p.speed + 0.5);
        best = { x, y, duration };
      }
    }
    return best;
  }

  _findOpenAttackSpace(p) {
    const isHome = p.team === 0;
    const dir = isHome ? 1 : -1;
    let best = null, bestScore = -Infinity;
    for (let i = 0; i < 5; i++) {
      const x = p.x + dir * (20 + Math.random() * 60);
      const y = p.y + (Math.random() - 0.5) * 80;
      if (x < this.padX + 40 || x > this.w - this.padX - 40) continue;
      if (y < this.padY + 30 || y > this.h - this.padY - 30) continue;
      let minOppD = Infinity;
      this.players.forEach(op => {
        if (op.team === p.team) return;
        const d = Math.hypot(op.x - x, op.y - y);
        if (d < minOppD) minOppD = d;
      });
      const score = minOppD - Math.abs(x - p.x) * 0.15;
      if (score > bestScore && minOppD > 45) {
        bestScore = score;
        best = { x, y };
      }
    }
    return best;
  }

  _getDefendPosition(p) {
    const isHome = p.team === 0;
    const b = this.ball;
    const carrier = b.possessor != null ? this.players[b.possessor] : null;
    const ownGoalX = isHome ? this.padX : this.w - this.padX;

    if (!carrier) return this._getBasePosition(p);

    const myDist = Math.hypot(p.x - carrier.x, p.y - carrier.y);
    let iAmClosest = true;
    this.players.forEach(op => {
      if (op.team === p.team && op !== p && op.role !== 'gk') {
        const d = Math.hypot(op.x - carrier.x, op.y - carrier.y);
        if (d < myDist) iAmClosest = false;
      }
    });

    if (p.role === 'def') {
      if (iAmClosest && myDist < this.fieldW * 0.38) {
        const goalSideDir = Math.sign(ownGoalX - carrier.x);
        return {
          x: carrier.x + goalSideDir * 10,
          y: carrier.y
        };
      }
      const base = this._getBasePosition(p);
      let nearestOpp = null, nearestD = Infinity;
      this.players.forEach(op => {
        if (op.team === p.team) return;
        const d = Math.hypot(op.x - base.x, op.y - base.y);
        if (d < 130 && d < nearestD) { nearestD = d; nearestOpp = op; }
      });
      if (nearestOpp) {
        const dirToGoal = Math.sign(ownGoalX - nearestOpp.x);
        const markX = nearestOpp.x + dirToGoal * 20;
        const maxX = isHome ? this.w * 0.48 : this.w * 0.52;
        return {
          x: isHome ? Math.min(markX, maxX) : Math.max(markX, maxX),
          y: nearestOpp.y
        };
      }
      return base;
    }

    if (p.role === 'mid') {
      if (iAmClosest && myDist < this.fieldW * 0.30) {
        const goalSideDir = Math.sign(ownGoalX - carrier.x);
        return {
          x: carrier.x + goalSideDir * 12,
          y: carrier.y
        };
      }
      const base = this._getBasePosition(p);
      return {
        x: base.x + (ownGoalX - base.x) * 0.20,
        y: base.y + (b.y - base.y) * 0.4
      };
    }

    if (p.role === 'fwd') {
      const base = this._getBasePosition(p);
      const midX = this.w / 2;
      return {
        x: base.x + (midX - base.x) * 0.4,
        y: base.y + (b.y - base.y) * 0.3
      };
    }

    return this._getBasePosition(p);
  }

  _pointToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx*dx + dy*dy;
    if (len2 === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  }

  _updateBall(dtSec) {
    const b = this.ball;

    if (b.possessor != null) {
      const p = this.players[b.possessor];
      b.x = p.x + (p.team === 0 ? 10 : -10);
      b.y = p.y;
      b.vx = 0; b.vy = 0;
      return;
    }

    const prevX = b.x, prevY = b.y;
    b.x += b.vx * dtSec;
    b.y += b.vy * dtSec;
    const friction = Math.pow(0.5, dtSec);
    b.vx *= friction;
    b.vy *= friction;

    if (b.y < this.padY + 3) { b.y = this.padY + 3; b.vy = -b.vy * 0.6; }
    if (b.y > this.h - this.padY - 3) { b.y = this.h - this.padY - 3; b.vy = -b.vy * 0.6; }

    const inGoalYRange = b.y > this.goalY1 && b.y < this.goalY2;
    if (b.x < this.padX + 3 && !inGoalYRange) {
      b.x = this.padX + 3; b.vx = -b.vx * 0.6;
    }
    if (b.x > this.w - this.padX - 3 && !inGoalYRange) {
      b.x = this.w - this.padX - 3; b.vx = -b.vx * 0.6;
    }

    // Гол в левые ворота
    if (b.x < this.padX && inGoalYRange) {
      this.awayScore++;
      this.lastConcedingTeam = 0;
      this._onGoal(1);
      return;
    }
    // Гол в правые ворота
    if (b.x > this.w - this.padX && inGoalYRange) {
      this.homeScore++;
      this.lastConcedingTeam = 1;
      this._onGoal(0);
      return;
    }

    const now = performance.now();
    if (now - b.lastKickTime < 180) return;
    b.freeTime += dtSec;
    if (b.freeTime < 0.04) return;

    let touchedIdx = -1;
    let bestDist = Infinity;
    this.players.forEach((p, i) => {
      const d = this._pointToSegment(p.x, p.y, prevX, prevY, b.x, b.y);
      const catchRadius = (p.role === 'gk') ? 22 : 13;
      if (d < catchRadius && d < bestDist) {
        bestDist = d;
        touchedIdx = i;
      }
    });

    if (touchedIdx >= 0) {
      b.possessor = touchedIdx;
      this.lastTouchIdx = touchedIdx;
      b.freeTime = 0;
      b.vx = 0; b.vy = 0;
      this.players[touchedIdx].runTimer = 0;
      this.players[touchedIdx].runTarget = null;
      this.players[touchedIdx].actionTimer = (this.players[touchedIdx].role === 'gk') ? 0.6 : 0;
    }
  }

  _onGoal(awardedToTeam) {
    this.ball.possessor = null;
    this.ball.vx = 0; this.ball.vy = 0;
    this._updateScoreUI();

    const scorerPlayer = (this.lastTouchIdx != null && this.players[this.lastTouchIdx]) ? this.players[this.lastTouchIdx] : null;
    let playerName = scorerPlayer ? scorerPlayer.name : 'Игрок';
    let isOwnGoal = false;

    if (scorerPlayer) {
      if (scorerPlayer.team !== awardedToTeam) {
        isOwnGoal = true;
      }
    }

    const currentMinute = Math.max(1, Math.min(90, Math.floor(this.gameTime / 60) + 1));
    this.events.push({
      minute: currentMinute,
      playerName: playerName,
      team: awardedToTeam,
      teamName: awardedToTeam === 0 ? this.homeName : this.awayName,
      isOwn: isOwnGoal
    });

    const msg = isOwnGoal ? `${playerName} Забил АвтоГол!` : `${playerName} Забил Гол!`;
    this._toast(msg, true);

    this.state = 'goal';
    this.stateTimer = 0;
  }

  _canShoot(p, goalX, goalY) {
    const dx = goalX - p.x;
    const dy = goalY - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist > this.fieldW * 0.42) return false;
    const angle = Math.atan2(Math.abs(dy), Math.abs(dx));
    return angle < 1.15;
  }

  _possessorDecisions(dtSec) {
    const idx = this.ball.possessor;
    const p = this.players[idx];
    if (p.actionTimer > 0) return;

    const isHome = p.team === 0;
    const attackGoalX = isHome ? this.rightGoalX : this.leftGoalX;
    const goalY = this.pitchCY;
    const distToGoal = Math.hypot(attackGoalX - p.x, goalY - p.y);
    const forwardDir = isHome ? 1 : -1;

    if (p.role === 'gk') {
      const target = this._findGKPassTarget(p);
      if (target) this._pass(p, target);
      else this._kickForward(p);
      p.actionTimer = 0.8;
      return;
    }

    if (this._canShoot(p, attackGoalX, goalY)) {
      let isBlocked = false;
      this.players.forEach(op => {
        if (op.team !== p.team && op.role !== 'gk') {
          const d = this._pointToSegment(op.x, op.y, p.x, p.y, attackGoalX, goalY);
          if (d < 18) isBlocked = true;
        }
      });

      if (!isBlocked && Math.random() < 0.80) {
        this._shoot(p, attackGoalX, goalY);
        p.actionTimer = 0.5;
        return;
      }
    }

    let obstacleAhead = false;
    this.players.forEach(op => {
      if (op.team !== p.team) {
        const dx = (op.x - p.x) * forwardDir;
        const dy = Math.abs(op.y - p.y);
        if (dx > 0 && dx < 85 && dy < 38) {
          obstacleAhead = true;
        }
      }
    });

    if (!obstacleAhead && distToGoal > this.fieldW * 0.22) {
      p.actionTimer = 0.2;
      return;
    }

    const runner = this._findRunningTeammate(p);
    if (runner && Math.random() < 0.55) {
      this._throughBall(p, runner);
      p.actionTimer = 0.45;
      return;
    }

    const bp = this._getBestPass(p);
    if (bp) {
      this._pass(p, this.players[bp.idx]);
      p.actionTimer = 0.4;
      return;
    }

    if (distToGoal < this.fieldW * 0.48) {
      this._shoot(p, attackGoalX, goalY);
    } else {
      this._kickForward(p);
    }
    p.actionTimer = 0.5;
  }

  _findGKPassTarget(p) {
    const isHome = p.team === 0;
    const dir = isHome ? 1 : -1;
    let best = null, bestScore = -Infinity;

    this.players.forEach(op => {
      if (op.team !== p.team || op === p) return;
      if (op.role === 'fwd') return;
      const dx = (op.x - p.x) * dir;
      if (dx < 20) return;
      const dist = Math.hypot(op.x - p.x, op.y - p.y);
      if (dist > this.fieldW * 0.55) return;

      let pressure = 0;
      this.players.forEach(def => {
        if (def.team === p.team) return;
        if (Math.hypot(def.x - op.x, def.y - op.y) < 35) pressure++;
      });
      if (pressure > 0) return;

      let blocked = false;
      this.players.forEach(def => {
        if (def.team === p.team) return;
        const d = this._pointToSegment(def.x, def.y, p.x, p.y, op.x, op.y);
        if (d < 22) blocked = true;
      });
      if (blocked) return;

      const score = -Math.abs(dist - 140) - pressure * 50;
      if (score > bestScore) { bestScore = score; best = op; }
    });
    return best;
  }

  _kickForward(p) {
    const b = this.ball;
    const isHome = p.team === 0;
    b.possessor = null;
    b.x = p.x;
    b.y = p.y;
    b.freeTime = 0;
    b.lastKickTime = performance.now();
    const dir = isHome ? 1 : -1;
    b.vx = dir * 270;
    b.vy = (Math.random() - 0.5) * 120;
  }

  _moveWithBall(p, dtSec) {
    const isHome = p.team === 0;
    const dir = isHome ? 1 : -1;
    const attackGoalX = isHome ? this.rightGoalX : this.leftGoalX;
    const distToGoal = Math.abs(attackGoalX - p.x);

    let nearestDef = null, minD = Infinity;
    this.players.forEach(op => {
      if (op.team === p.team) return;
      const d = Math.hypot(op.x - p.x, op.y - p.y);
      if (d < minD) { minD = d; nearestDef = op; }
    });

    let moveX = dir, moveY = 0;
    const defenders = this.players.filter(op => op.team !== p.team && op.role !== 'gk')
      .map(op => ({p:op,d:Math.hypot(op.x-p.x,op.y-p.y)})).sort((a,b)=>a.d-b.d);
    const threat = defenders[0];
    const leftSpace = p.y - (this.padY + 18), rightSpace = this.padY + this.fieldH - 18 - p.y;
    if (threat && threat.d < 72) {
      const side = threat.p.y <= p.y ? 1 : -1;
      const saferSide = leftSpace < 30 ? 1 : rightSpace < 30 ? -1 : side;
      moveY = saferSide * (threat.d < 38 ? 1.25 : 0.8);
      if (threat.d < 30) moveX = dir * 0.45;
      else moveX = dir * 1.05;
      if (threat.d < 58 && Math.abs(threat.p.y-p.y) < 24) moveY += (Math.random()<0.5?-1:1)*0.45;
    } else {
      const lane = p.baseY < 0.5 ? -1 : 1;
      const openY = p.y + lane * 24;
      let lanePressure = 0;
      this.players.forEach(op=>{if(op.team!==p.team && Math.hypot(op.x-(p.x+dir*65),op.y-openY)<55)lanePressure++;});
      moveY = lanePressure ? -lane*0.45 : lane*0.24;
    }
    if (distToGoal < this.fieldW * 0.32) {
      const dyToCenter = this.pitchCY - p.y;
      if (Math.abs(dyToCenter) > 22) moveY += Math.sign(dyToCenter) * 0.38;
    }

    const minY = this.padY + 25;
    const maxY = this.h - this.padY - 25;
    if (p.y < minY + 30) moveY += 1;
    if (p.y > maxY - 30) moveY -= 1;

    const norm = Math.hypot(moveX, moveY) || 1;
    const speed = nearestDef && minD < 38 ? 108 : 94;
    p.x += (moveX / norm) * speed * dtSec;
    p.y += (moveY / norm) * speed * dtSec;
    p.x = clamp(p.x, this.padX + 12, this.w - this.padX - 12);
    p.y = clamp(p.y, this.padY + 12, this.h - this.padY - 12);
  }

  _getBestPass(from) {
    const options = [];
    const attackDir = from.team === 0 ? 1 : -1;

    this.players.forEach((op, i) => {
      if (i === this.ball.possessor) return;
      if (op.team !== from.team) return;
      if (op.role === 'gk') {
        const dist = Math.hypot(op.x - from.x, op.y - from.y);
        if (dist > this.fieldW * 0.6) return;
      }

      const dx = op.x - from.x;
      const dy = op.y - from.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 30 || dist > this.fieldW * 0.6) return;

      let pressNear = 0;
      this.players.forEach(def => {
        if (def.team === from.team) return;
        if (Math.hypot(def.x - op.x, def.y - op.y) < 32) pressNear++;
      });
      if (pressNear > 0) return;

      let blocked = false;
      this.players.forEach(def => {
        if (def.team === from.team) return;
        const d = this._pointToSegment(def.x, def.y, from.x, from.y, op.x, op.y);
        const len2 = dx*dx + dy*dy;
        if (len2 > 0) {
          const t = ((def.x - from.x) * dx + (def.y - from.y) * dy) / len2;
          if (t > 0.10 && t < 0.90 && d < 22) blocked = true;
        }
      });
      if (blocked) return;

      const forward = dx * attackDir;
      let score = forward * 0.78 + (100 - Math.abs(dist - 125)) * 0.22;
      if (forward > 0) score += 20;

      options.push({ idx: i, score, forward, dist });
    });

    options.sort((a, b) => b.score - a.score);
    if (options.length >= 3 && Math.random() < 0.30) return options[2];
    if (options.length >= 2 && Math.random() < 0.25) return options[1];
    return options[0] || null;
  }

  _findRunningTeammate(from) {
    let best = null, bestScore = 0;
    const attackDir = from.team === 0 ? 1 : -1;

    this.players.forEach(op => {
      if (op.team !== from.team || op.role === 'gk' || op === from) return;
      if (op.runTimer <= 0 || !op.runTarget) return;

      const targetAdvance = (op.runTarget.x - from.x) * attackDir;
      if (targetAdvance < 60) return;

      let targetOpen = true;
      this.players.forEach(def => {
        if (def.team === from.team) return;
        const d = Math.hypot(def.x - op.runTarget.x, def.y - op.runTarget.y);
        if (d < 40) targetOpen = false;
      });
      if (!targetOpen) return;

      if (targetAdvance > bestScore) {
        bestScore = targetAdvance;
        best = op;
      }
    });
    return best;
  }

  _pass(from, to) {
    const b = this.ball;
    b.possessor = null;
    b.x = from.x + (from.team === 0 ? 10 : -10);
    b.y = from.y;
    b.freeTime = 0;
    b.lastKickTime = performance.now();

    let aimX = to.x, aimY = to.y;
    if (to.runTimer > 0 && to.runTarget) {
      aimX = to.x + (to.runTarget.x - to.x) * 0.5;
      aimY = to.y + (to.runTarget.y - to.y) * 0.5;
    }

    const dx = aimX - b.x;
    const dy = aimY - b.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = 235;
    b.vx = (dx / dist) * speed;
    b.vy = (dy / dist) * speed;
  }

  _throughBall(from, to) {
    if (!to.runTarget) return;
    const b = this.ball;
    b.possessor = null;
    b.x = from.x + (from.team === 0 ? 10 : -10);
    b.y = from.y;
    b.freeTime = 0;
    b.lastKickTime = performance.now();

    const dx = to.runTarget.x - b.x;
    const dy = to.runTarget.y - b.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = 275;
    b.vx = (dx / dist) * speed;
    b.vy = (dy / dist) * speed;
  }

  _shoot(from, goalX, goalY) {
    const b = this.ball;
    b.possessor = null;
    b.x = from.x + (from.team === 0 ? 10 : -10);
    b.y = from.y;
    b.freeTime = 0;
    b.lastKickTime = performance.now();

    const aimY = goalY + (Math.random() - 0.5) * this.goalH * 0.7;
    const dx = goalX - b.x;
    const dy = aimY - b.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = 410;
    b.vx = (dx / dist) * speed;
    b.vy = (dy / dist) * speed;
  }

  _moveToward(p, tx, ty, dtSec) {
    const dx = tx - p.x, dy = ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 2) {
      const spd = p.speed * dtSec;
      const mv = Math.min(spd, dist);
      p.x += (dx / dist) * mv;
      p.y += (dy / dist) * mv;
    }
    p.x = clamp(p.x, this.padX - 4, this.w - this.padX + 4);
    p.y = clamp(p.y, this.padY - 4, this.h - this.padY + 4);
  }

  _updateClockUI() {
    if(!this.elTime) return;
    const totalSecs = Math.floor(this.gameTime);
    const mm = Math.floor(totalSecs / 60).toString().padStart(2, '0');
    const ss = (totalSecs % 60).toString().padStart(2, '0');
    this.elTime.textContent = `${mm}:${ss}`;
  }

  _updateScoreUI() {
    if(this.elHScore) this.elHScore.textContent = this.homeScore;
    if(this.elAScore) this.elAScore.textContent = this.awayScore;
  }

  _toast(text, isGoal=false) {
    if(!this.elToast) return;
    this.elToast.textContent = text;
    this.elToast.classList.add('show');
    this.elToast.style.color = isGoal ? '#FFD700' : '#fff';
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      if(this.elToast) this.elToast.classList.remove('show');
    }, 2800);
  }

  draw() {
    const ctx = this.ctx;

    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0, 0, this.w, this.h);

    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(this.padX, this.padY, this.fieldW, this.fieldH);

    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    const stripes = 8;
    const sw = this.fieldW / stripes;
    for (let i = 0; i < stripes; i += 2) {
      ctx.fillRect(this.padX + i * sw, this.padY, sw, this.fieldH);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(this.padX, this.padY, this.fieldW, this.fieldH);
    ctx.beginPath();
    ctx.moveTo(this.w / 2, this.padY);
    ctx.lineTo(this.w / 2, this.h - this.padY);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(this.w / 2, this.pitchCY, this.centerRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(this.w / 2, this.pitchCY, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
    const by1 = this.pitchCY - this.boxH / 2;
    ctx.strokeRect(this.padX, by1, this.boxW, this.boxH);
    ctx.strokeRect(this.w - this.padX - this.boxW, by1, this.boxW, this.boxH);

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillRect(this.padX - this.goalDepth, this.goalY1, this.goalDepth, this.goalH);
    ctx.fillRect(this.w - this.padX, this.goalY1, this.goalDepth, this.goalH);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 0.8;
    for (let y = this.goalY1; y < this.goalY2; y += 4) {
      ctx.beginPath();
      ctx.moveTo(this.padX - this.goalDepth, y);
      ctx.lineTo(this.padX, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(this.w - this.padX, y);
      ctx.lineTo(this.w - this.padX + this.goalDepth, y);
      ctx.stroke();
    }

    this.players.forEach((p, i) => {
      const isPossessor = i === this.ball.possessor;

      ctx.beginPath();
      ctx.arc(p.x + 1.2, p.y + 1.6, 7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = isPossessor ? '#FFD700' : 'rgba(255,255,255,0.6)';
      ctx.lineWidth = isPossessor ? 2.2 : 1;
      ctx.stroke();

      if (p.role === 'gk') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fill();
      }

      if (p.name) {
        ctx.font = 'bold 9.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillText(p.name, p.x + 1, p.y - 11);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(p.name, p.x, p.y - 12);
      }
    });

    ctx.beginPath();
    ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(this.ball.x, this.ball.y, this.ball.r + 3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }

  endMatch() {
    this.isRunning = false;
    this.state = 'done';

    if (this.homeScore === this.awayScore) {
      this._toast('ПЕНАЛЬТИ!', true);
      if (this.elTime) this.elTime.textContent = 'ПЕН';
      setTimeout(() => {
        let hp = 3 + Math.floor(Math.random() * 3);
        let ap = 3 + Math.floor(Math.random() * 3);
        while (hp === ap) {
          hp = 3 + Math.floor(Math.random() * 3);
          ap = 3 + Math.floor(Math.random() * 3);
        }
        this._toast(`Пенальти: ${hp}:${ap}`, true);
        setTimeout(() => {
          if (this.onFinish) this.onFinish(this.homeScore, this.awayScore, hp, ap, this.events);
        }, 1500);
      }, 1400);
    } else {
      this._toast('МАТЧ ОКОНЧЕН');
      setTimeout(() => {
        if (this.onFinish) this.onFinish(this.homeScore, this.awayScore, null, null, this.events);
      }, 1500);
    }
  }
}

/* ============================================================
   ТЕКСТОВАЯ СИМУЛЯЦИЯ ФИНАЛА
   ============================================================ */
function runTextSimulation(t, bracket, ri, mi, onDone) {
  const R = bracket.rounds[ri];
  const m = R && R.matches[mi];
  if (!m || m.h == null || m.a == null) return;

  const hName = t.teams[m.h];
  const aName = t.teams[m.a];

  const totalGoals = 1 + Math.floor(Math.random() * 5);
  const goalMinutes = new Set();
  while (goalMinutes.size < totalGoals) {
    goalMinutes.add(1 + Math.floor(Math.random() * 89));
  }
  const goalEvents = Array.from(goalMinutes).map(min => ({
    min,
    isHome: Math.random() < 0.5
  }));

  const overlay = document.createElement('div');
  overlay.className = 'final-overlay';
  overlay.innerHTML = `
    <div class="text-sim-stage" style="margin:auto;">
      <div class="text-sim-minute" id="ts-minute">0'</div>
      <div class="text-sim-title">ФИНАЛ</div>
      <div class="text-sim-scoreboard" id="ts-scoreboard">
        <div class="text-sim-team left">${esc(hName)}</div>
        <div class="text-sim-score">
          <span id="ts-h">0</span>
          <span class="ts-sep">:</span>
          <span id="ts-a">0</span>
        </div>
        <div class="text-sim-team right">${esc(aName)}</div>
      </div>
      <div class="text-sim-events" id="ts-events"></div>
      <div class="text-sim-hint" id="ts-hint">Матч начинается...</div>
    </div>
    <button class="close-x" data-act="close-final">✕</button>
  `;
  document.body.appendChild(overlay);

  const minuteEl = overlay.querySelector('#ts-minute');
  const titleEl = overlay.querySelector('.text-sim-title');
  const hEl = overlay.querySelector('#ts-h');
  const aEl = overlay.querySelector('#ts-a');
  const sbEl = overlay.querySelector('#ts-scoreboard');
  const eventsEl = overlay.querySelector('#ts-events');
  const hintEl = overlay.querySelector('#ts-hint');

  let minute = 0;
  let hg = 0, ag = 0;
  let currentTimer = null;

  const cancel = () => {
    if (currentTimer) clearInterval(currentTimer);
    if (overlay.parentNode) overlay.remove();
    currentTextTimer = null;
  };
  overlay.querySelector('[data-act="close-final"]').onclick = cancel;

  const tick = () => {
    if (!document.body.contains(overlay)) { cancel(); return; }
    minute++;
    minuteEl.textContent = minute + "'";
    minuteEl.classList.add('pulse');
    setTimeout(() => minuteEl.classList.remove('pulse'), 150);

    if (minute === 45) {
      titleEl.textContent = 'ПЕРЕРЫВ';
      hintEl.textContent = 'Второй тайм...';
    } else if (minute === 46) {
      titleEl.textContent = 'ФИНАЛ';
    }

    goalEvents.forEach(ev => {
      if (ev.min === minute) {
        if (ev.isHome) hg++; else ag++;
        hEl.textContent = hg;
        aEl.textContent = ag;
        const evDiv = document.createElement('div');
        evDiv.className = 'text-sim-event';
        evDiv.innerHTML = `<span class="ev-min">${minute}'</span><span>⚽</span><span class="ev-team">${esc(ev.isHome ? hName : aName)}</span>`;
        eventsEl.appendChild(evDiv);
        eventsEl.scrollTop = eventsEl.scrollHeight;
        sbEl.classList.add('goal-flash');
        setTimeout(() => sbEl.classList.remove('goal-flash'), 500);
      }
    });

    if (minute >= 90) {
      clearInterval(currentTimer);
      currentTextTimer = null;
      finishTextSim();
    }
  };

  const finishTextSim = () => {
    minuteEl.textContent = "90'";
    let hp = null, pa = null;
    if (hg === ag) {
      titleEl.textContent = 'ПЕНАЛЬТИ';
      hintEl.textContent = 'Серия послематчевых пенальти';
      hp = 3 + Math.floor(Math.random() * 3);
      pa = 3 + Math.floor(Math.random() * 3);
      while (hp === pa) {
        hp = 3 + Math.floor(Math.random() * 3);
        pa = 3 + Math.floor(Math.random() * 3);
      }
      const evDiv = document.createElement('div');
      evDiv.className = 'text-sim-event';
      evDiv.innerHTML = `<span class="ev-min">ПЕН</span><span>⚽</span><span class="ev-team">${hp}:${pa}</span>`;
      eventsEl.appendChild(evDiv);
      minuteEl.classList.add('small');
      minuteEl.textContent = `ПЕН ${hp}:${pa}`;
    } else {
      titleEl.textContent = 'ФИНАЛ';
      hintEl.textContent = 'Финальный свисток!';
      minuteEl.classList.add('small');
      minuteEl.textContent = 'МАТЧ ОКОНЧЕН';
    }
    setTimeout(() => {
      if (overlay.parentNode) overlay.remove();
      if (onDone) onDone(hg, ag, hp, pa);
    }, 1600);
  };

  currentTimer = setInterval(tick, 45);
}

function runSkipSimulation(t, bracket, ri, mi, onDone) {
  const R = bracket.rounds[ri];
  const m = R && R.matches[mi];
  if (!m) return;
  let hg = Math.floor(Math.random() * 4);
  let ag = Math.floor(Math.random() * 4);
  let hp = null, pa = null;
  if (hg === ag) {
    hp = 3 + Math.floor(Math.random() * 3);
    pa = 3 + Math.floor(Math.random() * 3);
    while (hp === pa) {
      hp = 3 + Math.floor(Math.random() * 3);
      pa = 3 + Math.floor(Math.random() * 3);
    }
  }
  if (onDone) onDone(hg, ag, hp, pa);
}

function openFinalMatch(t, bracket, ri, mi) {
  if (document.querySelector('.final-overlay')) return;

  const wrapper = document.createElement('div');
  wrapper.innerHTML = FINAL_OVERLAY_HTML;
  const overlay = wrapper.firstElementChild;
  document.body.appendChild(overlay);

  const menu = overlay.querySelector('#mode-menu');
  menu.style.display = 'flex';

  menu.querySelectorAll('button[data-mode]').forEach(btn => {
    btn.onclick = () => {
      const mode = btn.dataset.mode;
      const R = bracket.rounds[ri];
      const m = R && R.matches[mi];
      if (!m) { closeFinalMatch(); return; }

      const finish = (hg, ag, hp, pa) => {
        m.hg = hg;
        m.ag = ag;
        m.ph = hp;
        m.pa = pa;
        m.p = true;
        closeFinalMatch();
        checkBracketProgress(bracket, true);
        saveTournament();
        render({keepScroll: true});
        if (bracket.champion != null) {
          setTimeout(() => showPodium(t, bracket), 500);
        }
      };

      if (mode === 'skip') {
        menu.style.display = 'none';
        runSkipSimulation(t, bracket, ri, mi, finish);
      } else if (mode === 'text') {
        menu.style.display = 'none';
        overlay.querySelector('.tv-scoreboard').style.display = 'none';
        runTextSimulation(t, bracket, ri, mi, finish);
      } else if (mode === 'play') {
        menu.style.display = 'none';
        overlay.querySelector('.tv-scoreboard').style.display = 'flex';
        startFinalMatch2D(t, bracket, ri, mi, finish);
      }
    };
  });
}

function startFinalMatch2D(t, bracket, ri, mi, onFinishResult) {
  const R = bracket.rounds[ri];
  const m = R && R.matches[mi];
  if (!m) return;
  const overlay = document.querySelector('.final-overlay');
  if (!overlay) return;
  const canvas = document.getElementById('pitch-canvas');
  if (!canvas) return;
  try {
    if (!document.fullscreenElement && overlay.requestFullscreen) overlay.requestFullscreen().catch(()=>{});
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  } catch(e) {}
  const homeName = t.teams[m.h];
  const awayName = t.teams[m.a];
  if (currentMatchEngine) currentMatchEngine.destroy();
  setTimeout(() => {
    currentMatchEngine = new FinalMatchEngine(canvas, homeName, awayName, 1, (hg, ag, ph, pa) => {
      currentMatchEngine = null;
      onFinishResult(hg, ag, ph, pa);
    }, {format:'5v5'});
  }, 30);
}

function startCustomMatch2D(mw){
  if (document.querySelector('.final-overlay')) return;

  const wrapper = document.createElement('div');
  wrapper.innerHTML = FINAL_OVERLAY_HTML;
  const overlay = wrapper.firstElementChild;
  document.body.appendChild(overlay);

  const menu = overlay.querySelector('#mode-menu');
  if(menu) menu.style.display = 'none';
  const sb = overlay.querySelector('.tv-scoreboard');
  if(sb) sb.style.display = 'flex';

  const canvas = document.getElementById('pitch-canvas');
  try {
    if (!document.fullscreenElement && overlay.requestFullscreen) overlay.requestFullscreen().catch(()=>{});
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  } catch(e) {}

  if (currentMatchEngine) currentMatchEngine.destroy();
  setTimeout(() => {
    currentMatchEngine = new FinalMatchEngine(
      canvas,
      mw.homeName,
      mw.awayName,
      1,
      (hg, ag, hp, ap, events) => {
        currentMatchEngine = null;
        closeFinalMatch();
        state.matchResult = {
          name: mw.name,
          format: mw.format,
          homeName: mw.homeName,
          awayName: mw.awayName,
          homeScore: hg,
          awayScore: ag,
          penaltyHome: hp,
          penaltyAway: ap,
          events: events || []
        };
        state.screen = 'match-result';
        render();
      },
      {
        format: mw.format,
        homePlayers: mw.homePlayers,
        awayPlayers: mw.awayPlayers
      }
    );
  }, 30);
}

function closeFinalMatch() {
  if (currentMatchEngine) {
    currentMatchEngine.destroy();
    currentMatchEngine = null;
  }
  if (currentTextTimer) {
    clearInterval(currentTextTimer);
    currentTextTimer = null;
  }
  const ov = document.querySelector('.final-overlay');
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  try { if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
  if (ov) {
    ov.style.transition = 'opacity .3s';
    ov.style.opacity = '0';
    setTimeout(() => { if (ov.parentNode) ov.remove(); }, 300);
  }
}

function showPodium(t, bracket) {
  bracket = bracket || getMainBracket(t);
  if (!bracket) return;
  if (document.querySelector('.podium-overlay')) return;
  const champ = bracket.champion;
  if (champ == null) return;

  let second = null, third = null;
  const finalR = bracket.rounds[bracket.rounds.length - 1];
  if (finalR && finalR.matches.length === 1) {
    const fm = finalR.matches[0];
    const w = matchWinner(fm);
    if (w != null) second = (w === fm.h ? fm.a : fm.h);
  }
  if (bracket.third && matchWinner(bracket.third) != null) {
    third = matchWinner(bracket.third);
  }

  const confColors = ['#FFD700','#C0C0C0','#CD7F32','#22c55e','#3b82f6','#ef4444','#a855f7','#ffffff'];
  const pieces = [];
  for (let i = 0; i < 80; i++) {
    const left = Math.random() * 100;
    const delay = (Math.random() * 3).toFixed(2);
    const dur = (2.8 + Math.random() * 3).toFixed(2);
    const col = confColors[Math.floor(Math.random() * confColors.length)];
    const w = 6 + Math.floor(Math.random() * 8);
    const h = 10 + Math.floor(Math.random() * 10);
    pieces.push(`<div class="confetti-piece" style="left:${left}%;width:${w}px;height:${h}px;background:${col};animation-delay:${delay}s;animation-duration:${dur}s;border-radius:${Math.random() < 0.4 ? '50%' : '2px'}"></div>`);
  }

  const ov = document.createElement('div');
  ov.className = 'podium-overlay';
  ov.innerHTML = `
    <button class="close-x" data-act="close-podium">✕</button>
    <div class="confetti-wrap">${pieces.join('')}</div>
    <div class="podium-title">
      <div class="trophy">🏆</div>
      <div class="label">ЧЕМПИОН</div>
      <div class="champ-name">${esc(t.teams[champ])}</div>
      <div class="sub">${esc(t.name)}</div>
    </div>
    <div class="podium-stage">
      ${second != null ? `<div class="podium-col pos-2"><div class="podium-name">${esc(t.teams[second])}</div><div class="podium-block silver">2</div></div>` : ''}
      <div class="podium-col pos-1"><div class="podium-name">${esc(t.teams[champ])}</div><div class="podium-block gold">1</div></div>
      ${third != null ? `<div class="podium-col pos-3"><div class="podium-name">${esc(t.teams[third])}</div><div class="podium-block bronze">3</div></div>` : ''}
    </div>
    <button class="podium-ok" data-act="close-podium">Отлично!</button>
  `;
  document.body.appendChild(ov);
  setTimeout(() => {
    if (ov.parentNode) {
      ov.style.transition = 'opacity .6s';
      ov.style.opacity = '0';
      setTimeout(() => ov.remove(), 600);
    }
  }, 11000);
}

/* ============ ACTIONS ============ */
function handleAction(act,el){
  const w=state.wiz;
  const mw=state.matchWiz;

  switch(act){
    case 'go-create-match':
      state.matchWiz = newMatchWiz();
      initMatchPlayers(state.matchWiz);
      state.screen = 'create-match';
      render();
      break;
    case 'set-match-fmt':
      if(mw){
        mw.format = el.dataset.fmt;
        initMatchPlayers(mw);
        render();
      }
      break;
    case 'match-wiz-back':
      if(mw && mw.step > 1){
        mw.step--;
        render();
      } else {
        state.screen = 'menu';
        render();
      }
      break;
    case 'match-wiz-prev':
      if(mw && mw.step > 1){
        mw.step--;
        render();
      }
      break;
    case 'match-wiz-next':
      if(mw){
        if(mw.step === 2 && !areAllMatchNamesFilled(mw)){
          alert('Пожалуйста, введите имена абсолютно всем игрокам перед продолжением!');
          break;
        }
        mw.step++;
        render();
      }
      break;
    case 'match-wiz-start':
      if(mw){
        startCustomMatch2D(mw);
      }
      break;
    case 'copy-match-export': {
      const ta = document.getElementById('match-export-area');
      if(!ta) break;
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      if(navigator.clipboard){
        navigator.clipboard.writeText(ta.value).then(()=>{}).catch(()=>{});
        ok = true;
      }
      alert(ok ? 'Код матча успешно скопирован!' : 'Скопируйте вручную из поля');
      break;
    }
    case 'do-match-import': {
      const ta = document.querySelector('[data-act="match-import-text"]');
      const val = ta ? ta.value : (mw ? mw.importText : '');
      if(!val || !val.trim()){ alert('Вставьте JSON-код матча'); break; }
      try {
        const obj = JSON.parse(val.trim());
        if(!obj.format || !FORMATIONS[obj.format]){
          alert('Ошибка: некорректный формат (должен быть 3v3, 5v5 или 7v7)');
          break;
        }
        state.matchWiz = {
          step: 3,
          name: obj.name || 'Импортированный матч',
          format: obj.format,
          homeName: obj.homeName || 'Красные',
          awayName: obj.awayName || 'Синие',
          homePlayers: Array.isArray(obj.homePlayers) ? obj.homePlayers : [],
          awayPlayers: Array.isArray(obj.awayPlayers) ? obj.awayPlayers : [],
          importText: ''
        };
        initMatchPlayers(state.matchWiz);
        render();
        alert('Матч успешно импортирован! Вы перенесены на финальный шаг.');
      } catch(e){
        alert('Ошибка при чтении JSON-кода матча: ' + e.message);
      }
      break;
    }

    case 'go-create':state.wiz=newWiz();state.screen='create';render();break;
    case 'go-import':state.screen='import';render();break;
    case 'go-settings':state.screen='settings';render();break;
    case 'go-about':state.screen='about';render();break;
    case 'continue':state.screen='tournament';state.round=1;state.tab=null;render();break;
    case 'to-menu':state.screen='menu';render();break;

    case 'wiz-back':if(w.step>1){w.step--;render();}else{state.screen='menu';render();}break;
    case 'wiz-next':
      if(w.step===3&&w.mode==='classic'){
        const errs=validateZones(w.zones,w.teams.length);
        if(errs.length){alert('Исправьте зоны:\n'+errs.join('\n'));break;}
      }
      w.step++;render();break;
    case 'wiz-prev':w.step--;render();break;
    case 'wiz-create':createTournament();break;
    case 'set-mode':w.mode=el.dataset.mode;render();break;

    case 'preset':{
      const key=el.dataset.key;
      const p=findPreset(key);
      if(p){w.presetKey=key;w.teams=p.teams.slice(0,32);w.zones=defaultZones(w.teams.length);render();}
      break;
    }
    case 'count-inc':setCount(w.teams.length+1);break;
    case 'count-dec':setCount(w.teams.length-1);break;
    case 'shuffle':{const a=w.teams;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}render();break;}
    case 'reset-names':w.teams=w.teams.map((t,i)=>'Команда '+(i+1));render();break;
    case 'load-bulk':{
      const ta=document.querySelector('[data-act="bulk"]');if(!ta)break;
      const list=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if(list.length<2){alert('Минимум 2 команды');break;}
      w.teams=list.slice(0,32);w.zones=defaultZones(w.teams.length);render();
      break;
    }
    case 'save-preset':{
      const name=(w.newPresetName||'').trim();
      if(!name){alert('Введите название');break;}
      customPresets.push({name,teams:w.teams.slice()});
      LS.set('ft_presets',customPresets);w.newPresetName='';alert('Пресет сохранён');render();
      break;
    }
    case 'circ-inc':w.circles=clamp(w.circles+1,1,54);render();break;
    case 'circ-dec':w.circles=clamp(w.circles-1,1,54);render();break;
    case 'zone-add':w.zones.push({type:'styk',from:1,to:1});render();break;
    case 'zone-del':w.zones.splice(+el.dataset.i,1);render();break;

    case 'tab':state.tab=el.dataset.tab;render();break;
    case 'round-prev':state.round=Math.max(1,state.round-1);render();break;
    case 'round-next':{
      const t=state.tournament;
      let maxR=1;
      if((t.mode||'classic')==='worldcup'&&t.groups)maxR=t.groups[0]?t.groups[0].schedule.length:1;
      else maxR=t.schedule.length;
      state.round=Math.min(maxR,state.round+1);render();
      break;
    }
    case 'random-round':{
      const t=state.tournament;
      const r=t.schedule[state.round-1];if(!r)break;
      r.matches.forEach(m=>{m.hg=Math.floor(Math.random()*4);m.ag=Math.floor(Math.random()*4);m.p=true;});
      saveTournament();render();break;
    }
    case 'random-group-round':{
      const t=state.tournament;
      t.groups.forEach(g=>{
        const r=g.schedule[state.round-1];if(!r)return;
        r.matches.forEach(m=>{m.hg=Math.floor(Math.random()*4);m.ag=Math.floor(Math.random()*4);m.p=true;});
      });
      saveTournament();render();break;
    }
    case 'random-all':
      showRandomAllDialog();
      break;

    case 'clear-round':{
      const t=state.tournament;const r=t.schedule[state.round-1];if(!r)break;
      if(!confirm('Очистить тур '+r.round+'?'))break;
      r.matches.forEach(m=>{m.hg=null;m.ag=null;m.p=false;});
      saveTournament();render();break;
    }

    case 'make-playoff':if(confirm('Сформировать стыковые матчи и плей-офф?'))makeClassicPlayoff();break;
    case 'make-wc-knockout':if(confirm('Сформировать плей-офф ЧМ?'))makeWCKnockout();break;
    case 'make-lch-playoff':if(confirm('Сформировать стыковые матчи?'))makeLCHPlayoff();break;

    case 'play-final':{
      const t=state.tournament;
      const kind=el.dataset.bracket;
      const ri=+el.dataset.ri;
      const mi=+el.dataset.mi;
      let bracket=null;
      if(kind==='ko')bracket=t.knockout;
      else if(kind==='po')bracket=t.playoff;
      else if(kind==='lchpo')bracket=t.lchPlayoff;
      if(!bracket)break;
      if(bracket.third && matchWinner(bracket.third)==null){
        alert('Сначала завершите матч за 3-е место!');
        break;
      }
      openFinalMatch(t, bracket, ri, mi);
      break;
    }
    case 'close-final':{
      closeFinalMatch();
      break;
    }
    case 'random-third':{
      const t=state.tournament;
      const kind=el.dataset.bracket;
      const bracket=kind==='ko'?t.knockout:t.playoff;
      if(!bracket || !bracket.third) break;
      if(matchWinner(bracket.third)!=null) break;
      let hg=Math.floor(Math.random()*5), ag=Math.floor(Math.random()*5);
      if(hg===ag){ if(Math.random()<0.5)hg++; else ag++; }
      bracket.third.hg=hg;
      bracket.third.ag=ag;
      saveTournament();
      render({keepScroll:true});
      break;
    }
    case 'close-podium':{
      const ov=document.querySelector('.podium-overlay');
      if(ov){ov.style.transition='opacity .4s';ov.style.opacity='0';setTimeout(()=>ov.remove(),400);}
      break;
    }

    case 'random-bracket':{
      const t=state.tournament;
      const which=el.dataset.bracket;
      const mainBracket=getMainBracket(t);
      const before=mainBracket && mainBracket.champion;
      let ok=false;
      if(which==='ko'&&t.knockout)ok=randomizeBracketRound(t.knockout,true);
      if(which==='po'&&t.playoff)ok=randomizeBracketRound(t.playoff,true);
      if(which==='styk'&&t.styk)ok=randomizeStykClassic();
      if(which==='lchpo'&&t.lchPlayoff){ok=randomizeBracketRound(t.lchPlayoff,false);if(ok)checkLCHPlayoffComplete();}
      if(!ok){alert('Все матчи завершены');break;}
      saveTournament();render({keepScroll:true});
      const after=mainBracket && mainBracket.champion;
      if(after!=null&&before==null)setTimeout(()=>showPodium(t,mainBracket),400);
      break;
    }

    case 'copy-export':{
      const ta=document.getElementById('export-area');if(!ta)break;
      ta.select();ta.setSelectionRange(0,999999);
      let ok=false;try{ok=document.execCommand('copy');}catch(e){}
      if(navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>{}).catch(()=>{});ok=true;}
      alert(ok?'Код скопирован':'Скопируйте вручную');
      break;
    }
    case 'reset-tournament':{
      if(!confirm('Сбросить все результаты?'))break;
      const t=state.tournament;
      if(t.schedule)t.schedule.forEach(r=>r.matches.forEach(m=>{m.hg=null;m.ag=null;m.p=false;}));
      if(t.groups)t.groups.forEach(g=>g.schedule.forEach(r=>r.matches.forEach(m=>{m.hg=null;m.ag=null;m.p=false;})));
      t.knockout=null;t.playoff=null;t.styk=null;t.lchPlayoff=null;t.phase='regular';
      state.round=1;saveTournament();render();break;
    }
    case 'delete-tournament':{
      if(!confirm('Удалить турнир?'))break;
      state.tournament=null;LS.set('ft_tournament',null);state.screen='menu';render();break;
    }
    case 'do-import':{
      const ta=document.querySelector('[data-act="import-text"]');if(!ta)break;
      tryImport(ta.value);break;
    }
    case 'set-theme':settings.theme=el.dataset.theme;LS.set('ft_settings',settings);applyTheme();render();break;
    case 'set-accent':settings.accent=el.dataset.accent;LS.set('ft_settings',settings);applyTheme();render();break;
    case 'del-preset':customPresets.splice(+el.dataset.i,1);LS.set('ft_presets',customPresets);render();break;
    case 'clear-data':
      if(!confirm('Удалить все данные?'))break;
      localStorage.removeItem('ft_tournament');localStorage.removeItem('ft_presets');localStorage.removeItem('ft_settings');
      state.tournament=null;customPresets=[];settings={theme:'dark',accent:'#22c55e'};applyTheme();render();
      break;
  }
}

function tryImport(text){
  if(!text||!text.trim()){alert('Вставьте код');return;}
  let obj=null;
  try{obj=JSON.parse(text.trim());}catch(e){alert('Ошибка JSON');return;}
  const err=validateImported(obj);
  if(err){alert('Ошибка: '+err);return;}
  state.tournament=obj;state.round=1;
  state.tab=(obj.mode==='worldcup')?'groups':(obj.mode==='lch')?'league':'table';
  state.screen='tournament';saveTournament();render();
  alert('Турнир «'+obj.name+'» импортирован!');
}

function validateImported(o){
  if(!o||typeof o!=='object')return 'не объект';
  if(!Array.isArray(o.teams)||o.teams.length<2)return 'нет команд';
  if(!o.mode)o.mode='classic';
  if(o.mode==='worldcup'){if(!Array.isArray(o.groups))return 'нет групп';}
  else{if(!Array.isArray(o.schedule)||!o.schedule.length)return 'нет календаря';}
  if(typeof o.name!=='string')o.name='Импортированный';
  if(!Array.isArray(o.zones))o.zones=[];
  if(o.playoff===undefined)o.playoff=null;
  if(o.styk===undefined)o.styk=null;
  if(o.knockout===undefined)o.knockout=null;
  if(o.lchPlayoff===undefined)o.lchPlayoff=null;
  return null;
}

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const tag=el.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='OPTION')return;
  handleAction(el.dataset.act,el);
});

document.addEventListener('input',function(e){
  const el=e.target;const act=el.dataset.act;if(!act)return;
  if(state.screen==='create')wizardField(act,el,false);
  else if(state.screen==='create-match')matchWizardField(act,el,false);
  else if(state.screen==='tournament')tourField(act,el,false);
});

document.addEventListener('change',function(e){
  const el=e.target;const act=el.dataset.act;
  if(act==='import-file'){
    const f=el.files&&el.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=function(){tryImport(String(fr.result));};
    fr.readAsText(f);
    return;
  }
  if(!act)return;
  if(state.screen==='create')wizardField(act,el,true);
  else if(state.screen==='create-match')matchWizardField(act,el,true);
  else if(state.screen==='tournament')tourField(act,el,true);
});

applyTheme();
if(state.tournament){
  try{const err=validateImported(state.tournament);if(err)state.tournament=null;}catch(e){state.tournament=null;}
}
render();
</script>
